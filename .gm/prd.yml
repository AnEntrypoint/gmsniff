- id: embed-health-recent-window-has-no-total
  note: 'Measured on a live server: /api/embed-health returns recent capped at 20 while its own byEvent map sums to 255 events, so 235 are hidden and the response carries NO total (''total'' in j === false). It is the SOLE outlier among the four recent-window routes -- the other three all already return it: :1132 recallStats returns {total: evs.length, hits, misses, hitRate, avgDur, recent}, :1144 execStats returns {total: evs.length, byRuntime, errors, recent}, :1152 hookStats returns {total: evs.length, byEvent, recent}, and :184 classifierRejects returns {total: rejects.length, byReason, recent}. Add total (and recent_returned) to embedHealth so it matches its siblings. This is the route whose entire purpose is diagnosing SILENT embedding failure, which makes an unreported cap on it especially wrong.'
  status: completed
  witness: 'embedHealth now returns total/recent_returned/recent_truncated beside its recent window, matching the four siblings that already did (recallStats, execStats, hookStats, classifierRejects) -- verified by reading their returns rather than assuming: each is {total: evs.length, ..., recent}, so embed-health was the sole outlier. The magic 20 became EMBED_HEALTH_RECENT_WINDOW declared above its use. Witnessed on the live route in both directions: unscoped returns total 257, recent_returned 20, recent_truncated true, so the 237 hidden events are now derivable where before ''total'' in j was false; scoped to a quiet project (C:/dev/aloop) returns total 0, recent_returned 0, recent_truncated false, so an empty result never carries a false truncation claim. node test.js exit 0.'
  commit_comment: Report total beside embed-health's recent window like its four siblings already do
- id: exhaustive-truncation-sweep-replacing-one-per-cycle-search
  note: 'Three consecutive gm cycles each found exactly one more instance of the same silent-truncation defect (memory-graph, then CLI lists, then /api/distinct + /api/search, then embed-health). That pattern means the SEARCH was wrong, not that the work is endless -- a grep-then-fix loop surfaces instances one at a time forever. Replace it with one exhaustive pass: enumerate EVERY route in the ROUTES manifest programmatically, request each against a live server with a limit small enough to force truncation, and classify each response as (a) reports total/returned/truncated, (b) provably cannot truncate, or (c) caps silently. Assert the (c) set is empty at the end. The enumeration must come from the ROUTES array itself rather than a hand-written list, so a route added later is covered automatically rather than needing another cycle to discover.'
  status: completed
  witness: 'Built and run: the sweep parses the GET routes out of the server''s own ROUTES manifest (regex over src/server.js) rather than a hand-written list, so a route added later is covered without another discovery cycle, and classifies each live response as reports-a-signal / provably-complete / silently-caps. Final run over 40 routes: 17 report a signal, 23 provably complete, SILENT CAPS 0. Getting there required fixing MY OWN detector twice, both caught by measurement rather than assumed away. (1) The first version treated any array longer than the forced limit as a cap and flagged 19 routes, nearly all whole-set enumerations (8 gates, 92 verbs, 6 phases) -- wrong. (2) The second compared each array against ITSELF at limit=2 vs limit=100000, which reported 0 caps and looked like success, but the negative test proved it blind: a fixed-window route like recent.slice(-20) ignores limit and returns 20 either way, so a REVERTED embed-health passed clean. Replaced with a comparison against an independent count-map sibling in the same response, restricted to maps whose values are all non-negative integers after summing a float summary (119414.5) and a timestamp (1.78e12) produced nonsense flags. Two surviving flags were verified BY HAND as genuine population mismatches and encoded with their reasons: instruction-tiers byTier sums 79 across overlapping buckets while details is 56 and equals byTier.vendored exactly, and live-state reports 4 live agents by design while byActivity counts all 174 discovered including 108 abandoned.'
  commit_comment: Replace the one-instance-per-cycle search with an exhaustive route sweep
- id: cli-surfaces-consuming-recent-windows-must-show-the-omission
  note: A route that reports truncation while its consumer stays silent only relocates the defect -- the same rule applied when /api/memory-graph was fixed. Once embed-health carries a total, check every CLI and GUI surface that renders a `recent` window (src/cli.js --embed-health / --recall-misses / --classifier-rejects paths and any GUI panel fetching those routes) and make each print the omitted count using the writeOmittedRowsNote helper already added to src/cli.js this session. Verify by running the real CLI against data that exceeds the window, not by reading the render code.
  status: completed
  witness: 'Checked each CLI surface by RUNNING it rather than reading the render code, and found the defect on the manager view itself rather than where the row predicted. --embed-failures turned out already honest: it prints ''# embed failures: 39 (structured events)'' and shows every group, and it is its own code path rather than a consumer of /api/embed-health. The real gap was --agents: its per-agent feed rendered a.recent.slice(-outputLines) with nothing naming the remainder, measured by running --output-lines 2 vs 20 against spoint and getting exactly 2 vs 20 lines, so the history is genuinely longer and was being hidden on the tool''s PRIMARY view. Fixed with the same shape as the other lists. Witnessed both directions on the real CLI: --output-lines 2 prints ''+398 earlier events not shown (--output-lines 2)'' per agent, and --output-lines 500 prints ZERO such notices (grep -c = 0) because the whole feed fits, so a complete feed never carries a false omission. Nearly 400 events per agent were invisible before this. node test.js exit 0.'
  commit_comment: Name the earlier events the manager view's feed leaves out
- id: witness-embed-health-and-sweep-over-and-under
  note: 'Same boundary discipline that caught every defect this session. embed-health: witness on a project whose event count EXCEEDS the 20-row window (the local store measured 255) confirming total is reported and the omission derivable, and on one under it confirming no false truncation claim. The exhaustive sweep: assert its (c) silently-caps set is EMPTY as the pass/fail condition, and prove the sweep can actually FAIL by temporarily pointing it at a known-bad shape or by checking it flagged /api/embed-health BEFORE the fix -- a sweep that has never once reported a failure is untested and worth nothing. Witness everything by running against a live server and reading real JSON, never by inspecting source.'
  status: completed
  witness: 'Every fix witnessed over and under its boundary, and the sweep proven able to FAIL rather than merely never having failed -- which is what the row demanded and what turned out to matter most. embed-health: unscoped gives total 257 / recent_returned 20 / recent_truncated true; a quiet project (C:/dev/aloop) gives 0/0/false. Agents feed: --output-lines 2 prints ''+398 earlier events not shown'', --output-lines 500 prints zero notices. Sweep, run in BOTH directions on live servers: with the fix in place 40 routes swept, 17 report a signal, 23 provably complete, SILENT CAPS 0; with the embed-health fix surgically reverted, SILENT CAPS 1 naming exactly ''/api/embed-health | recent:20 but sibling byEvent sums to 257 with no signal'' and nothing else. That negative test is the reason this row exists and it earned its place: an earlier detector version reported a clean 0 with the fix REVERTED, because comparing an array against itself at two limits is blind to a fixed-window route that ignores limit entirely. Had I trusted the first clean run, I would have shipped a sweep that could never catch the defect it was built for.'
  commit_comment: Prove the truncation sweep fails when the defect is reintroduced
