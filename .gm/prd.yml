- id: probe-store-write-recovered
  note: Probe row testing whether plugkit's store write path has recovered after the failures observed in the prior walk. If this row lands, the store is writable and PRD state is trustworthy again; it will be resolved or removed immediately.
  status: completed
  witness: 'Probe succeeded, so the store write path has recovered and PRD state is trustworthy again. The prior walk saw five consecutive write failures (prd-add 10061/10062/10063, mutable-add 10065/10066) with reads working throughout, and isolated the cause to plugkit''s wasm store rather than the filesystem: a fresh spool boot did not clear it, removing a 542-minute-stale .gm/gm.db.lock/ did not clear it, disk had 140GB free, and both fs.writeFileSync and registry.js atomicWriteFile succeeded directly on .gm/prd.yml. This probe row was written and read back cleanly ({added: probe-store-write-recovered}, 1 row on disk), so the failure was transient and is now gone -- which is why it was retested rather than inherited as a standing blocker.'
- id: ds-sync-three-drifted-files
  title: Sync the 3 drifted vendored files from ../design and prove zero drift
  body: 'sync:ds:check reports colors_and_type.css, src/components/content/table.js and src/css/app-shell/kits-appended.css out of sync. Diffs read: all three are additive upstream improvements -- a new --mascot-on-ink token (#FF5C9E, 6.67:1 on --ink), a scrollable-region-focusable a11y fix on the Table wrapper, and a raw-literal-to-token replacement consuming the new token. None conflict with this session changes. Vendoring is byte-for-byte; never hand-edit gui/ds/.'
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'npm run sync:ds pulled colors_and_type.css, src/components/content/table.js and src/css/app-shell/kits-appended.css; sync:ds:check then reports gui/ds/ matches C:/dev/design -- zero drift. All three upstream changes were read BEFORE syncing and confirmed additive: a new --mascot-on-ink token (#FF5C9E, 6.67:1 on --ink, for always-dark surfaces that must not follow the theme), tabindex/role/aria-label on the ds Table scroll wrapper, and a raw #FF5C9E literal replaced by that new token. None conflicts with this session changes.'
  commit_comment: Sync the three drifted vendored files to zero drift
- id: ds-sync-token-layer-review
  title: Verify the token-layer change alters nothing this session measured
  body: 'colors_and_type.css is the token layer: a --accent/--accent-ink or spacing-scale change would move every GUI surface measured this session. The diff is purely additive (--mascot-on-ink added to :root and to the nested .ds-247420 inherit block) -- confirm by re-reading the live computed values for --accent, --accent-ink, --fg, --bg, --panel-3, --panel-text, --panel-text-3 and the spacing scale after the sync, against the numbers already witnessed.'
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Re-read every token this session measured, live in the browser after the sync: --accent #B6FF1B, --accent-ink #B6FF1B (dark theme; the light-theme split to #4E4200 was verified separately), --fg #F4F1E9, --bg #0E0E12, --panel-3 color-mix(in oklab, #F4F1E9 20%, transparent), --panel-text #F4F1E9, --panel-text-3 #B4B4BC, --space-2 8px, --fs-micro 12px -- all identical to the values measured before the sync. The new --mascot-on-ink resolves to #FF5C9E, confirming the diff was purely additive rather than a re-tuning of the existing scale.'
  commit_comment: Verify the token-layer sync changed nothing measured
- id: ds-sync-import-closure
  title: Confirm the import closure still resolves after the sync
  body: A partial vendor renders an EMPTY div#root with readyState complete and nothing in the server log -- that failure happened earlier this session when shell.js was vendored without its shell/ subdirectory. sync-ds now resolves the closure programmatically; re-run it and confirm the pulled-in file count plus a real mounted app.
