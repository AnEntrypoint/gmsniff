- id: drain-agents-md-back-pressure
  note: 'plugkit''s own memorize-fire response reported back_pressure_warning with flat_streak=11 and dropped_since_last_fire=false: AGENTS.md has not shrunk across 11 consecutive memorize-fire calls (20526 bytes, 126 lines), so the bidirectional-migration drain obligation has been skipped repeatedly. Fire the substance of the detail-heavy single-surface sections to the default namespace, compress each drained paragraph to a one-line pointer in the SAME commit, and witness BOTH directions: fact recallable from the store AND AGENTS.md byte count measurably lower.'
  status: completed
  witness: 'Drain witnessed in BOTH directions as the policy requires. Store direction: two memories fired and embedded -- mem-48a224323ae38d75-2457 (2457 bytes, gui/ds vendoring mechanics: sync-ds.mjs and VENDORED_PATHS_RELATIVE_TO_BOTH_ROOTS, why an npm dep does not fit given the exports map exposes only ./dist/247420.js scoped under .ds-247420, why sync is deliberately not wired into npm install/prepare, the app-shell.css seventeen-target inert-CSS failure, the npm pack --dry-run check) and mem-2bc48fd3de049f27-1724 (1724 bytes, information-tiering mechanics: renderShell/printHelp daily-first ordering, gmsniff.nav.advanced localStorage toggle, Ctrl+K palette and #panel= deep links, --schema tier fields, the SUBSYSTEMS/SUB_LIST duplicated literal and its runtime observedSubsystems merge), both returning ok:true with embedded:true and an .gm/memories/*.md file. Document direction: AGENTS.md measured 20526 bytes before and 18807 after, a real 1719-byte drop, 126 lines to 122, with all 16 section headings still present. Three sections compressed to pointer form (gui/ds vendoring, Packaging, Information tiering), each retaining its binding rule inline and naming the recall key for the drained mechanics.'
  commit_comment: Drain gui/ds-vendoring and information-tiering mechanics to the store, 20526 to 18807 bytes
- id: correct-stale-browser-blocker-mutable
  note: '.gm/mutables.yml carries witness_evidence asserting the browser verb has a ''real, reproducible environmental gap'' that forces curl + node --check substitutes for every client-side witness, and cites ''typeof page returned undefined'' plus SyntaxError on session close/reset as proof. Execution refuted that diagnosis this session: the verb evaluates in page context (cdp-eval), so those are the expected symptoms of driver-context code, not a broken environment. Correct or supersede the stale text so a future session reading mutables.yml does not re-trust the refuted claim and re-adopt the substitute-witness workaround.'
  status: completed
  witness: 'Row mut-browser-witness-client-edits now carries the corrected evidence naming the refuted diagnosis explicitly, and the stale row is gone. Sequence witnessed: mutable-add re-scoping the id APPENDED a second row rather than upserting (unlike prd-add), leaving the id at both line 17 and line 51 and the file at 12 rows with the refuted ''real, reproducible environmental gap'' text still readable as its own standalone row -- a future reader could have hit the stale one first. A guarded script (aborts unless the row it keeps contains ''REFUTED by execution'') dropped the 4-line stale block; exec_js-9231 returned rows_before:12, rows_after:11, corrected_present:true, and reported the file is LF-terminated, not CRLF. Re-parsed through gmsniff''s own src/registry.js parseYamlRows in exec_js-9232: parsed_rows 11, unique_ids 11, duplicate_ids [], statuses {witnessed: 11}. The single remaining occurrence of the old phrase is inside the correction text itself, which quotes the refuted claim in order to name it.'
  commit_comment: Correct the refuted browser-verb blocker on its mutable row and drop the duplicate
- id: drain-must-not-lose-load-bearing-rules
  note: 'Degenerate case of the drain: compressing a paragraph to a pointer can silently delete a rule that binds future work. AGENTS.md''s own comment doctrine says a rule binding future work belongs in AGENTS.md rather than a source comment, so a drained section must leave behind a one-line pointer that still names the constraint, not merely a topic word. Verify after the drain that every drained section retains a pointer line naming its binding rule, and that the cross-cutting sections (report-measurements-never-a-verdict, comments-are-a-liability, zero-dependencies, three-meanings-of-liveness) remain resident and uncompressed.'
  status: completed
  witness: 'Verified by reading the compressed sections back: every drained section retains its binding rule inline as an imperative, with only the mechanics moved to recall. gui/ds vendoring keeps ''Never hand-edit a file under gui/ds/'' plus the fix-upstream/sync/check order and the bolded ''Vendoring a file means vendoring its whole import closure'' with its silently-inert-CSS consequence. Packaging keeps the rule that a partial vendor is caught by the closure rule and never by packaging, plus the npm pack --dry-run check. Information tiering keeps the bolded ''Do not flatten, merge, or re-alphabetize that ordering as cleanup'' and the bolded ''The two must stay identical'' constraint on SUBSYSTEMS/SUB_LIST with its confirm-against-../gm requirement. Each compressed section names its recall key so the mechanics are reachable rather than lost. The four cross-cutting sections named in this row were confirmed still resident and uncompressed by direct grep: ''Report measurements, never bake in a verdict'', ''Comments are a liability...'', ''Zero dependencies'' and ''Liveness has three distinct meanings'' each return exactly 1 match, and all 16 section headings remain in the file.'
  commit_comment: Verify every drained section keeps its binding rule and the cross-cutting rules stay resident
- id: witness-drained-facts-are-actually-recallable
  note: The drain is only half-done if the fact leaves AGENTS.md but never lands retrievably in the store -- that is strictly worse than not draining, because the rule is then nowhere. For each drained section, dispatch a real recall query against its substance and read the returned hits to confirm the fired memory is actually retrievable by a query a future session would plausibly issue, not merely that memorize-fire returned ok:true with an embedded flag.
  status: completed
  witness: Retrievability witnessed by real recall dispatches, not by trusting memorize-fire's ok:true. Query 'why is gui/ds vendored instead of an npm dependency and what does sync:ds check' returned mem-48a224323ae38d75-2457 as the TOP hit at score 0.798, well clear of the next result (0.604). Query 'which localStorage key controls the show advanced nav toggle and where do subsystem tags come from' returned mem-2bc48fd3de049f27-1724 as the TOP hit at 0.653. Both queries were phrased as a future session would naturally ask them rather than echoing the memory text, and each drained fact ranked first on its own subject, so the material is genuinely reachable from the store and not merely present in it.
  commit_comment: Witness both drained facts rank first on natural recall queries
- id: mutable-add-appends-rather-than-upserts
  note: 'Discovered mid-EXECUTE this turn: prd-add upserts on an existing id (returns {rescoped}), but mutable-add with an existing id APPENDS a second row instead, leaving two rows sharing one id. Re-scoping mut-browser-witness-client-edits produced a 12-row file where the refuted claim and its correction sat as separate standalone rows, so a reader could hit the stale one first -- the exact contradictory-store failure the correction was meant to prevent, silently created by the correction itself. Required a guarded dedupe script. Record this asymmetry so a future session does not assume mutable-add re-scopes, and confirm whether gmsniff''s own mutable-writing surfaces (src/registry.js rewriteRow and the /api/mutables route) upsert correctly by id or reproduce the same append behavior.'
  status: completed
  witness: 'Asymmetry confirmed and scoped to plugkit, NOT to gmsniff. Plugkit side, witnessed live this turn: mutable-add with the existing id mut-browser-witness-client-edits returned {added: ...} and appended a second row, leaving that id at both line 17 and line 51 of .gm/mutables.yml (12 rows where there were 11) with the refuted claim and its correction standing as separate rows; prd-add by contrast upserts and reports {rescoped}. gmsniff side, witnessed by executing its own writer against a real fixture (exec_js-9249): rewriteRow(text, id, fields) -- note it takes and RETURNS file text, it does not take a path or write, which is why an earlier probe passing a path silently returned null and changed nothing -- correctly upserts in place, turning row-a into {status: witnessed, text: CORRECTED} while leaving row-b byte-identical, yielding rows_after 2 with duplicate_ids [], and returns null for an unknown id rather than appending a new row. So gmsniff''s /api/mutables write path does not reproduce the append behavior; only the plugkit verb does.'
  commit_comment: Witness mutable-add appends while gmsniff rewriteRow correctly upserts
