- id: agent-card-shows-prose-heading-as-phase
  note: 'Witnessed in the live GUI live-agents panel: each card renders TWO phase-ish values and one of them is scraped next-step.md prose, not the authoritative phase. casey renders ''PLAN'' beside ''COMPLETE'' while .gm/turn-state.json says phase=COMPLETE and next-step.md''s heading is ''# PLAN''; looper renders ''UPDATE-DOCS'' beside ''COMPLETE'' -- UPDATE-DOCS is a SKILL name and not a phase at all; aloop renders ''EXECUTE/EXECUTE''. AGENTS.md states turn-state.json is the primary phase source and prose scraping is the fallback, so displaying the scraped heading next to the real phase presents a stale/wrong value as though it were data. Decide what that first slot is actually for (served-prose section, or last_skill) and label it truthfully, or remove it.'
  status: pending
- id: working-agents-banner-contradicts-running-idle-split
  note: 'The live-agents panel header says ''6 working agents, longest-silent first'' and immediately below the same page renders ''RUNNING - 2'' and ''IDLE - 4''. Two counts of the same set, disagreeing, on one screen: the banner calls four idle agents ''working''. Witnessed live with 6 rows where only gmsniff and spoint were dispatching. Make the banner state the same fact the cards do -- count running separately from idle, or rename the banner to what it actually counts (discovered/reported), never a bare ''working'' that the rows below contradict.'
  status: pending
- id: health-banner-reports-watcher-not-running-when-daemon-is-alive
  note: 'The live-agents health banner prints ''looper (watcher not running, silent 185m)'', ''casey (watcher not running, silent 167m)'', ''aloop (watcher not running...)'' and ''gm (watcher not running...)''. Measured directly: ALL six projects report .status.json pid 10648 with status_ts age between 23ms and 197ms -- one shared machine-wide daemon, alive and heartbeating for every one of them. The banner is deriving daemon liveness from watcher.log mtime (looper 186min, casey 168min, aloop 143min), which measures PROJECT idleness, not daemon liveness -- exactly the three-meanings-of-liveness substitution AGENTS.md names as the recurring bug. Report the project''s real silence duration without asserting a false claim about the daemon.'
  status: pending
- id: instruction-column-shows-prose-heading-not-instruction
  note: Both the CLI --agents INSTRUCTION column and the GUI agent card render the literal word 'ORCHESTRATOR' as the served instruction, for every project. ORCHESTRATOR is the first markdown heading of next-step.md, not an instruction -- it is identical across all agents and therefore carries zero information in the column whose entire purpose is 'what instruction is this agent executing right now'. The real per-agent content is the phase-specific section below it (PLAN/EXECUTE/EMIT prose), which next_step_headings shows as the 2nd or 3rd heading. Extract and show the instruction that actually distinguishes one agent from another.
  status: pending
- id: event-feed-renders-empty-details-and-mid-sentence-truncation
  note: 'Witnessed in the live CLI --agents output feed: (1) ''embed_init_fail'' renders with a completely EMPTY detail -- a bare event name and trailing whitespace, so the reader learns an init failed but nothing about what or why; (2) ''embed.slim-build-no-fallback this is a slim build (feature=slim): no wasm-embedded safetensors fallback exists, and the'' is cut mid-sentence at a hard character cap, losing the actual consequence clause; (3) 4 of spoint''s 7 feed lines are bare ''dispatch.end <verb>'' with no duration, which crowds out the substantive events (prd.added/prd.resolved) in a fixed-height feed. Fix all three: render a real detail or say plainly there is none, truncate on a word boundary with an explicit ellipsis, and stop letting low-information repeats displace high-information lines.'
  status: pending
- id: event-detail-renderer-misses-the-error-field
  note: 'ROOT CAUSE of the empty ''embed_init_fail'' detail, measured against real watcher.log records: gm emits its explanatory text under DIFFERENT keys per event kind. embed_init_fail carries {error: ''slim build has no wasm-side embedding fallback -- host_vec_embed must be implemented by the host (e.g. agentplug-runner native candle path)''} while embed.slim-build-no-fallback carries {reason: ''...''}. Key frequency over the matched lines: error 3, reason 3, event 6, ts 6. The feed renderer surfaces one of these keys and not the other, so a fully-explanatory message is discarded and the operator sees a bare event name -- the same producer/consumer field-name mismatch class that previously made gates_failing empty for every project. Enumerate the detail-bearing keys that actually occur in real data and render whichever is present, rather than hardcoding one name.'
  status: pending
- id: projects-route-ships-163kb-to-render-two-rows
  note: 'Measured against the live server: /api/projects returns 163KB across 173 rows of which only 2 are alive (171 idle). Average row 962 bytes, and the per-row ''liveness'' sub-object is 657 of those bytes -- 68% of the payload -- shipped in full for every idle project the panel does not display. Comparable routes: /api/project-signals 71KB, /api/deviations 72KB, /api/watcher-versions 25KB. This is the single biggest presentation cost in the tool and it is paid on every poll. Reduce what crosses the wire for rows that are not rendered (summary row + on-demand liveness detail, or a scoped/paged shape) WITHOUT making any project unreachable -- report-measurements-never-a-verdict forbids dropping idle rows from the result set, so the fix is payload shape, never omission.'
  status: pending
- id: stuck-projects-route-is-live-but-unreferenced
  note: /api/stuck-projects still exists and serves 72KB on request, but grep across gui/app.js, gui/panels.js, gui/live-agents.js, gui/shared.js and gui/data.js finds ZERO references to it -- no panel fetches it. It is dead surface still carrying the name AGENTS.md records as the canonical report-a-measurement-never-a-verdict failure (it decided 15min was stale, 10 rows a backlog, and returned only projects scoring above zero). Confirm nothing else consumes it (CLI, --schema, external), then remove it, or if some consumer does exist, verify it no longer omits rows. Leaving a 72KB verdict-shaped route reachable invites a future panel to wire itself back to the exact shape the doctrine forbids.
  status: pending
- id: health-summary-ships-38kb-for-a-six-row-banner
  note: /api/health-summary returns 38.5KB and is fetched by gui/app.js to render the live-agents health banner, which displays six one-line rows (name, watcher state, silence duration, deviations/min). The banner needs roughly 6 x 60 bytes of the payload it receives. Same class as the /api/projects finding but on the route that renders FIRST and therefore gates time-to-first-meaningful-paint on the panel the whole tool leads with. Shrink what the banner route returns to what the banner shows, keeping every project reachable through the fuller routes.
  status: pending
- id: dispatch-end-noise-crowds-the-output-feed
  note: 'Measured in the live CLI feed: 4 of spoint''s 7 visible lines are bare ''dispatch.end <verb>'' carrying no duration and no outcome, and gmsniff''s feed spends 2 of 7 lines the same way. The feed is fixed-height, so every dispatch.end line evicts a substantive one (prd.added, prd.resolved, instruction.served, a real error). AGENTS.md notes dispatch.end is the ONLY evt carrying {ms, verb} and pairs with the synthesized dispatch.start -- so the duration exists in the record and is being dropped at render time, leaving the least informative possible version of the line. Either render it with its duration so it becomes useful, or rank it below substantive events so it never evicts one; state the count of anything hidden.'
  status: pending
- id: dispatch-duration-is-present-on-every-record-and-discarded
  note: 'Measured 400 real dispatch.end records from C:/dev/spoint: 100% carry a numeric ms field. Median 560ms, MAX 339670ms -- a 5.7-MINUTE dispatch that the feed rendered as a bare ''dispatch.end <verb>'' line with no indication anything was slow. The single most actionable number for ''what is this agent stuck on right now'' is present in every record and thrown away at render time. Surface the duration on the line, and make an outlier legible as a measurement (show the ms, sorted or highlighted by magnitude) without inventing a slow/fast verdict threshold. Verb frequency in the sample: prd-resolve 170, git_finalize 76, instruction 39, prd-add 37, memorize-fire 24, recall 17.'
  status: pending
- id: cli-and-gui-disagree-on-the-same-facts
  note: 'Captured within seconds of each other from the same data: CLI --agents printed ''2 shown / 70 discovered'' while the GUI banner printed ''6 working agents'' and ''6 shown / 6 reported by live-state'', and the GUI listed gm/aloop/casey/looper as rows the CLI had folded into ''68 idle/abandoned/COMPLETE agent(s) hidden''. Two surfaces over one dataset giving different totals and different membership, with no way for a reader to tell which is right. Define ONE vocabulary for the counts (discovered / working / running / idle / hidden) and make both surfaces report the identical numbers from the identical predicate, each naming what it omitted.'
  status: pending
- id: events-limit-is-unbounded-and-ignores-negative
  note: 'Measured against the live server: /api/events?limit=99999999 returns 3,586,977 bytes (3.5MB, the entire 10026-row store) and /api/events?limit=-5 returns 3,585,213 bytes -- a NEGATIVE limit is silently ignored rather than rejected or clamped, and dumps everything. This is the largest payload the tool can be made to produce, from a single malformed query, and any panel bug or hand-edited URL triggers it. Clamp limit to a sane maximum and reject/normalize non-positive values, reporting the applied limit and the true total in the response so the caller can see it was capped rather than silently receiving a truncated or gigantic set.'
  status: pending
- id: keep-gui-escaping-verified-under-hostile-values
  note: 'Witnessed PASSING and worth keeping verified rather than assumed: navigating the GUI to #panel=tree&sess=<img src=x onerror=window.__xss=1> produced xss_fired false, injected_img false, and no literal onerror handler anywhere in document.body.innerHTML -- the sess value is escaped on render even though /api/process-tree echoes the raw string back in its JSON. Any presentation rework that changes how event details, instruction text, prompts or project names reach the DOM must re-run this check, because the drained/reshaped render path is exactly where an escape gets dropped. Event detail strings now come from arbitrary gm output (error/reason fields), so they are the highest-risk new sink.'
  status: pending
