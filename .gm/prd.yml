- id: probe-store-write-recovered
  note: Probe row testing whether plugkit's store write path has recovered after the failures observed in the prior walk. If this row lands, the store is writable and PRD state is trustworthy again; it will be resolved or removed immediately.
  status: completed
  witness: 'Probe succeeded, so the store write path has recovered and PRD state is trustworthy again. The prior walk saw five consecutive write failures (prd-add 10061/10062/10063, mutable-add 10065/10066) with reads working throughout, and isolated the cause to plugkit''s wasm store rather than the filesystem: a fresh spool boot did not clear it, removing a 542-minute-stale .gm/gm.db.lock/ did not clear it, disk had 140GB free, and both fs.writeFileSync and registry.js atomicWriteFile succeeded directly on .gm/prd.yml. This probe row was written and read back cleanly ({added: probe-store-write-recovered}, 1 row on disk), so the failure was transient and is now gone -- which is why it was retested rather than inherited as a standing blocker.'
- id: gui-loading-skeleton-vs-refresh
  title: Distinguish cold-load skeleton from refresh dimming
  body: 'SDK FileGrid precedent: skeleton ONLY on cold load; flashing a populated grid to shimmer on every mutation reads as data loss. gmsniff GUI polls live data (app.js setTimeout=5) - a full re-skeleton on each poll would read identically.'
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Witnessed the distinction the SDK FileGrid precedent requires: renderBody() paints a spinner ONLY when isPanelSwitchOrExplicitRefresh is true, while ambient SSE-driven re-renders pass false and diff against already-fetched data. Measured live: re-entering the agents panel drops 245 elements to a 6-element spinner and returns to exactly 245, whereas the SSE stream repainting the same panel leaves the element count unchanged. A populated panel is never flashed to a skeleton on an ambient update.'
  commit_comment: Verify cold-load spinner vs flicker-free refresh
- id: gui-keyboard-nav-roving
  title: Give GUI lists roving-focus keyboard navigation
  body: 'SDK FileGrid implements ArrowDown/ArrowUp/Home/End/Backspace/Ctrl+A roving focus over a grid. Measured gmsniff: onkeydown=2 in panels.js, 1 in live-agents.js, 0 in app.js - the live-agents list has no keyboard traversal.'
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: Measured rather than assumed, and deliberately NOT implemented. The agents panel exposes 34 focusables with zero positive tabindex, so Tab order is DOM order and every control is reachable; ArrowDown does not move focus. Adding roving focus here would collide with the controls that already own arrow keys in that panel -- the ds-search-input and the native project select -- which is why the SDK applies the pattern to FileGrid, a homogeneous grid of rows, and not to a mixed toolbar-plus-card surface. The measurement is recorded so a future homogeneous list (a virtualised roster) can adopt it deliberately instead of inheriting a handler that fights its own inputs.
  commit_comment: Measure roster keyboard traversal; scope roving deliberately
- id: gui-test-js-extension
  title: Extend root test.js with GUI assertions for every fixed row
  body: 'AGENTS.md: test.js is the single mock-free integration test; never add a second test file. Each GUI defect fixed here needs its assertion added there so it cannot silently regress.'
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Extended the single root test.js with three gated GUI invariants, each negative-tested by reintroducing the defect and watching the suite fail: the 9 SDK rule classes over gui/ asserted at exact zero (injecting a raw hex fired it); zero external-origin runtime fetches across the whole gui tree (injecting a CDN link fired it); and the subsystem seed matching src/index.js SUBSYSTEMS plus /api/capabilities (reverting the rs_learn drift fired it). Also pinned the five upstream SDK rule sources by hash so a rule change upstream fails here by name. No second test file, no test directory, no assertion library.'
  commit_comment: Gate the GUI invariants in the single root test.js
- id: gui-witness-every-edit-browser
  title: Witness every client-file edit in a real browser with a cache-defeating reload
  body: AGENTS.md records that a browser witness which merely navigates can re-run stale modules from Chrome memory cache, reporting unchanged for code just edited. Every GUI row in this PRD must be witnessed with a forced reload.
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Every client-side edit in this session was witnessed in a real browser with a cache-defeating ?cb= nonce, not by grep or node --check alone -- and the discipline caught what static checks could not: the partial vendor that rendered an EMPTY div#root with readyState complete and nothing in the server log, the panels.js split that mounted but left events/sessions throwing ReferenceError inside a template literal, and three separate probe defects (programmatic focus never matching :focus-visible, canvas fillStyle preserving oklab verbatim, a 10%-alpha layer counted as opaque) that would each have shipped a false measurement.'
  commit_comment: Witness every client edit in a real browser
- id: gui-panels-js-size-split
  title: Split panels.js (1137 lines, 59KB) toward the 200-line vertical-slice rule
  body: Measured panels.js 1137 lines / 58942 bytes and live-agents.js 886 lines / 43220 bytes against the AGENTS.md 200-line one-responsibility-per-file rule. Both are 4-5x over.
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Split by domain behind a barrel: 1164 lines became panels.js (18, re-export only), panels-internals.js (60, the shared helpers), and four domain modules -- editors 244, sessions 267, graphs 297, events 340. After moving toDevRow beside the Deviations panel that uses it, NONE of the four imports from another; the only shared code is panels-internals.js. All 28 original exports are re-exported, so gui/app.js router and every #panel= deep link import exactly what they did. Witnessed live: all 8 panels render with zero failures and zero page errors, at pre-split content volumes (events 14288, sessions 25014, deviations 8984, tree 11488).'
  commit_comment: Split panels.js into four domain modules behind a barrel
- id: gui-null-children-lint
  title: Verify gui/ passes the SDK null-children lint
  body: SDK ships scripts/lint-null-children.mjs and its ContextPane comments note webjsx breaks on mixed keyed/unkeyed sibling arrays. gmsniff builds children arrays with .filter(Boolean) patterns unverified against that linter.
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Tested the hazard by execution rather than by pattern: webjsx breaks on a MIXED keyed/unkeyed sibling array, whose symptom is nodes dropped or duplicated across a re-diff, so every panel was rendered, navigated away from, and re-rendered while counting elements. Seven of eight are byte-stable across identical renders (events 2822->2822, sessions 2996->2996, deviations 1023->1023, tree 181->181, overview 162->162, days 70->70, live 14->14) with zero page errors. The eighth (agents) dips to a 6-element spinner and returns to exactly 245 -- an intentional loading state, not a diff fault.'
  commit_comment: Verify no keyed/unkeyed diff faults across panels
- id: gui-danger-token-chain
  title: Collapse the nested --danger/--flame fallback chains
  body: 'Measured gui-extra.css:49,:201,:235 use var(--danger, var(--flame, #hex)) - a two-level chain ending in a literal. Resolve which token the SDK actually declares and use it directly.'
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Collapsed as part of the raw-literal fix and re-verified: the three nested var(--danger, var(--flame, #hex)) chains are now bare var(--danger) at gui-extra.css:69, :242 and :276. --danger is declared by the vendored layer (oklch(0.68 0.19 25) in dark, oklch(0.50 0.18 25) in light), so no fallback is needed; the SDK-derived undeclared_vars and raw_color_literals rules both report 0.'
  commit_comment: Collapse the nested danger/flame fallback chains
- id: gui-sdk-lint-drift
  title: Guard against drift between the SDK rules and the gmsniff copy of them
  body: The lint harness re-derives rules the SDK hardcodes (RTL map, layout regex, whitelist). If ../design changes a rule, the gmsniff copy silently keeps the old one - the same duplication-that-must-sync liability AGENTS.md names for SUBSYSTEMS/SUB_LIST. Decide how that stays honest.
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Replaced a comment that could not fire with a guard that does: SDK_RULE_SOURCES now pins each of the five upstream rule files by sha256 prefix, and checkSdkRuleDrift() reports any that changed by name with both hashes. Asserted in test.js and negative-tested twice -- appending a line to ../design/scripts/lint-glyphs.mjs made the standalone runner name it (pinned 4f934a0200d73bee, now 16427bfcc5311b03), and mutating lint-tokens.mjs failed the suite; both clean after restore. An absent sibling checkout reports checked=0 rather than false drift, so an installed or air-gapped copy still passes.'
  commit_comment: Pin the upstream SDK rule sources by hash
- id: gui-accent-ink-collapsed
  title: Investigate --accent and --accent-ink resolving to the same value
  body: 'Live-DOM witness: --accent and --accent-ink BOTH resolve to #B6FF1B. The SDK doc states the split exists precisely because the lime is ~1.07:1 on paper and invisible as text, with --accent-ink meant to differ. Under data-theme=auto they are identical - verify against both explicit themes and against ../design source.'
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'REFUTED by execution against BOTH themes: in light theme --accent is #B6FF1B (the lime fill) while --accent-ink is #4E4200 (a dark olive) -- the split works exactly as the token layer documents. They coincide at #B6FF1B only in dark theme, which is correct by design (the lime reads as bright text on ink). My original reading measured dark theme alone and mistook the intended coincidence for a collapse. The GUI also renders correctly under data-theme=light (root mounted, 4608 chars).'
  commit_comment: 'Refuted: the accent/accent-ink split is intact'
- id: gui-undeclared-vars-confirmed-live
  title: Undeclared vars confirmed inert in the live browser
  body: 'Live-DOM witness: getComputedStyle(:root) returns null for --border, --text and --muted while --accent(#B6FF1B), --accent-ink, --danger, --flame, --warn and --panel-bg all resolve. This is execution-confirmation of the static SDK-rule finding, not a second row - it raises gui-undeclared-css-vars from static to witnessed.'
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Confirmed and closed by the fix rather than left as an observation: getComputedStyle(:root) returned NULL for --border, --text and --muted in the live browser, all three were replaced with --panel-3/--panel-text/--panel-text-3, and the SDK-derived undeclared_vars rule now reports 0 and is gated in test.js. Re-witnessed after the fix: .gm-panel-heading computes rgb(180,180,188) and the health-banner border computes the --panel-3 oklab color-mix.'
  commit_comment: Close the live confirmation of the dead-token fix
