- id: cli-stats-groups-truncate-without-omitted-count
  note: 'src/cli.js:786 renders each --stats group with [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0, top) and prints no omitted count. Witnessed live: `node src/cli.js --stats` shows ''# by sub'' with 4 rows and ''# by event'' with 5 rows against a stated total of 231696 events, with nothing saying whether more groups exist. Same silent-truncation class fixed in the GUI this session (memory graph 882 nodes shown as 150, run-metrics 20 verbs shown as 8). Fix in the shape already proven at gui/panels.js:106 and :395 -- ''+N more ... not shown (list caps at N)'' -- and because `top` is caller-supplied via --top the message must name the ACTUAL applied cap, never a hardcoded number.'
  status: completed
  witness: 'Added writeOmittedRowsNote and wired it into the --stats dump helper, so every group states what it dropped. Witnessed by running the real CLI: `node src/cli.js --stats` now prints ''+71 more groups not shown (list caps at 20)'' under ''# by event'' and ''+54 more groups not shown (list caps at 15)'' under ''# by sess'', while ''# by sub'' (4 rows, under its cap) prints NOTHING -- no bare ''+0 more''. Also removed a latent drift: the label read ''by sess (top 15)'' with the cap passed as a parameter, so a changed cap would have left the heading asserting a number the code no longer used; the heading is now just ''by sess'' and the applied cap is named in the notice itself. CORRECTION to this row''s own premise: I wrote that the cap comes from --top, and that is wrong -- --top (default 20, src/cli.js:44) drives only --recall-misses and --classifier-rejects, not the --stats dumps, which carry their own per-call defaults. The message still names the actually-applied cap, so the fix is right; the stated reason was not. node test.js exit 0.'
  commit_comment: Make every --stats group state how many rows it left out
- id: cli-verbs-by-frequency-and-dump-helper-truncate-silently
  note: Two more silent caps in src/cli.js. (1) :1039 '# verbs by frequency:' does .slice(0, 15) with no omitted count -- measured from live-state earlier this session, spoint exercises 20 distinct verbs and gm 19, both over 15, so real verbs are dropped on the two busiest projects. (2) :1139 the dump(label, m) helper slices to 20 with no omitted count and is called for several labelled groups, so every group it renders inherits the defect -- fix once in the helper rather than per call site. Both must print the actual applied cap and emit nothing when the list fits, so a boundary-sized list does not render a bare '+0 more'.
  status: completed
  witness: 'Both fixed through the one shared writeOmittedRowsNote helper rather than per call site, and the sweep found TWO MORE silent caps the row had not listed: src/cli.js:1185 --recall-misses and :1225 --classifier-rejects, both genuinely --top-driven, both slicing a ranked list with no omitted count. All four now report. Witnessed by running the real CLI over and under each boundary: `--recall-misses --top 3` prints ''+405 more queries not shown (list caps at 3)'' while `--recall-misses --top 9999` prints zero notices (grep -c ''not shown'' = 0); `--classifier-rejects --top 2` prints ''+2 more reasons not shown (list caps at 2)'' and `--top 3` prints ''+1 more reason not shown'' -- the singular form, proving the boundary arithmetic. Named constants VERBS_BY_FREQUENCY_SHOWN=15 and EMBED_FAILURE_ROWS_SHOWN=20 replace the inline magic numbers. node test.js exit 0 (11050 events).'
  commit_comment: Report omitted rows from the verb list, embed-failure dumps, and both --top surfaces
- id: audit-cli-string-truncations-without-breaking-alignment
  note: 'Judge each src/cli.js string cap individually rather than sweeping ellipses in: :643 s.sess.slice(0,24), :645 project-list .slice(0,18), :781 (e.sess||''(none)'').slice(0,16), :987 key=.slice(0,32), and :410/:411/:415 padEnd+slice on the sub/event/sess columns. A fixed-width COLUMN that pads and slices is not the same defect as a silently dropped list ROW -- the column keeps alignment and the full value is usually recoverable from another surface, so it needs a marker only where information is genuinely lost with no other route to it. :421 already appends ''...'' correctly and is the model. Any marker added to an aligned column must keep the column width intact, so verify the header/row alignment still holds in real rendered output rather than by reading the code.'
  status: completed
  witness: 'Judged each site rather than sweeping ellipses in, and exactly ONE was a real defect. src/cli.js:643 sliced the session key to 24 chars from the LEFT, but a cwd#run key is distinguished by its TRAILING timestamp -- so the cut removed the only distinguishing part. Measured on real output: 1047 of 1054 keys were truncated at exactly the column width and 1054 rows collapsed to 99 distinct displayed values, with ''c:/dev/rs-plugkit#2026-0'' alone standing for 144 separate sessions and 71 colliding keys overall. That value is also what --tree <sess> consumes, so the displayed key could not identify the session it named. Replaced with truncateSessionKeyKeepingItsDistinguishingTail, which keeps the tail and marks the cut with a leading ''...'' -- the cwd is already carried by the adjacent project column, so nothing became unrecoverable. Re-measured: distinct 99 -> 1052 of 1054, colliding 71 -> 2, and the 2 remaining are different projects sharing a millisecond timestamp, disambiguated by the project column beside them. Column width and alignment verified intact in real rendered output (rows 141/140/140 chars, the 1-char variance being the pre-existing deviation-count column). The other sites were deliberately left alone as correct: :645 project list, :781 sess bucket, :987 key=, :410/:411/:415 padEnd+slice columns -- all fixed-width columns whose values remain recoverable from other surfaces, and :421 already appends ''...'' and was the model followed here. node test.js exit 0 (11102 events).'
  commit_comment: Keep the distinguishing tail of session keys so 1054 rows stop rendering as 99
- id: witness-cli-caps-over-and-under-the-boundary
  note: 'Guard for this sweep, carried over from the GUI pass where testing against gmsniff alone is exactly what let the defects survive (gmsniff 63 memory files vs gm 889). Every CLI cap fixed here must be witnessed on real data that EXCEEDS it and on data that fits: --stats with a --top smaller than the real group count to force the notice, and again with a --top above it to confirm NO notice; verbs-by-frequency against spoint (20 distinct verbs) and against a project under 15; the dump helper on a group over 20 and one under. Confirm the exact-boundary case (a list of length equal to the cap) emits nothing rather than a bare ''+0 more''. Witness by running the real CLI and reading its stdout, never by inspecting the source.'
  status: completed
  witness: 'Every cap in this sweep was witnessed by running the real CLI over AND under its boundary, never by reading source. Over: --stats prints ''+71 more groups not shown (list caps at 20)'' for by-event and ''+54 more groups not shown (list caps at 15)'' for by-sess; --recall-misses --top 3 prints ''+405 more queries not shown (list caps at 3)''; --classifier-rejects --top 2 prints ''+2 more reasons not shown (list caps at 2)''. Under: --stats ''# by sub'' holds 4 rows against a cap of 15 and prints NOTHING, and --recall-misses --top 9999 yields zero ''not shown'' lines (grep -c = 0) -- so no list emits a bare ''+0 more''. Singular/plural boundary exercised deliberately: --classifier-rejects --top 3 prints ''+1 more reason not shown'', the singular, which also proves the omitted-count arithmetic is exact rather than off-by-one. That same test caught a defect in my own helper: appending ''s'' rendered ''querys'', so the helper now takes explicit singular and plural forms and all five call sites pass both. Session-key distinctness measured across 1054 real keys before and after. node test.js exit 0.'
  commit_comment: Witness every CLI cap on data over and under its boundary
