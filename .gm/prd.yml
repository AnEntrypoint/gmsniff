- id: probe-store-write-recovered
  note: Probe row testing whether plugkit's store write path has recovered after the failures observed in the prior walk. If this row lands, the store is writable and PRD state is trustworthy again; it will be resolved or removed immediately.
  status: completed
  witness: 'Probe succeeded, so the store write path has recovered and PRD state is trustworthy again. The prior walk saw five consecutive write failures (prd-add 10061/10062/10063, mutable-add 10065/10066) with reads working throughout, and isolated the cause to plugkit''s wasm store rather than the filesystem: a fresh spool boot did not clear it, removing a 542-minute-stale .gm/gm.db.lock/ did not clear it, disk had 140GB free, and both fs.writeFileSync and registry.js atomicWriteFile succeeded directly on .gm/prd.yml. This probe row was written and read back cleanly ({added: probe-store-write-recovered}, 1 row on disk), so the failure was transient and is now gone -- which is why it was retested rather than inherited as a standing blocker.'
- id: design-shell-height-overflow
  title: Fix the sidebar overflowing the shell (side h=530 in a 439px viewport)
  body: 'CORRECTED after a deeper read: the earlier main-308-vs-panelBody-1837 reading was NOT a defect -- #app-main computes overflow:auto and #panel-body overflow:visible, so that is a correctly-scrolling container, and documentElement.scrollHeight equals the 439px viewport exactly, meaning the shell does contain itself. The real overflow is .app-side at h=530 inside a 439px viewport, so the sidebar runs past the shell bottom and its lower nav entries fall outside the frame.'
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: completed
  witness: 'REFUTED by execution: the sidebar h=530 in a 439px viewport is the same short-landscape fold as the status-bar row, and the shell contains itself correctly -- documentElement.scrollHeight equals the 439px viewport exactly, #app-main computes overflow:auto and #panel-body overflow:visible, so the earlier main-308-vs-panelBody-1837 reading was a correctly-scrolling container rather than a broken one. At 1440/1280/1024 the sidebar measures 610px against a taller frame with its own scroll. No fix warranted.'
  commit_comment: 'Refuted: shell sizing is correct; the reading was a fold artifact'
- id: design-scan-affordance
  title: Make the roster scannable by the thing a manager actually scans for
  body: The manager view answer is who needs attention and why. That is currently prose inside a card. It should be the strongest visual element in the row.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-witness-before-after
  title: Witness every design change with a real before/after measurement
  body: A design claim without a measurement is an opinion. Every row here closes on a live-DOM number (density, contrast, size ramp, element count) or a screenshot pair, never on prose.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-type-scale-collapse
  title: Replace the 6-size flat type ramp with a real hierarchy
  body: 'Measured live text sizes: 16px x112, 15px x58, 13px x60, 14px x16, 12px x15, 11px x1. Two adjacent sizes (15/16) carry 170 of 262 text elements and differ by one pixel, which reads as noise rather than hierarchy. The SDK ships a full --fs-* scale (pico 10 / nano 11 / micro 12 / tiny 13 / xs 14 / sm 15 / body 16 / lg 18 / xl 21 plus clamp-based display sizes) -- pick deliberate steps from it per role.'
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-accent-underused
  title: Use the electric lead accent where it carries meaning
  body: 'Measured live colour census: --accent lime rgb(182,255,27) appears on 9 elements against 340 at body tone and 50 at tier-3. The Acid Editorial north-star is one electric lead against near-black ink; at 9 uses the lead is effectively absent and every surface reads uniformly grey. Decide the small set of things that earn the accent (current phase, running state, primary action) rather than sprinkling it.'
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-information-density-mode
  title: Offer a density control the way the SDK FileGrid does
  body: The SDK ships a list/compact/thumb density radiogroup for FileGrid. The agents roster has one fixed presentation. A manager scanning 16 projects and an operator reading one instruction want different densities of the same data.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-monospace-usage
  title: Decide deliberately where monospace belongs
  body: 'Two families render: system-ui and ui-monospace. Monospace should mark machine-truth (paths, ids, durations, payloads) and never body prose; verify each current use earns it.'
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-status-bar-absent
  title: The status bar renders display:none at zero height
  body: 'Measured live: .app-status computes display:none, w=0, h=0. The shell passes a Status({left,right}) with the project cwd and a glance summary, and none of it is visible. Either the status bar earns its place and must render, or the information it carries needs another home -- currently the code builds it and the user never sees it.'
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: completed
  witness: 'REFUTED by execution, not fixed: .app-status computes display:none because sidebar-misc.css hides it under @media (max-height: 500px) and (orientation: landscape), and the measuring window was 782x439 -- a short landscape fold, exactly the case that rule targets, with its own comment naming a 360px-tall fold where 114px of chrome would be a third of the screen. The status bar is correctly suppressed there, not missing. My first reading mistook a deliberate responsive decision for a defect because I measured at one accidental window size.'
  commit_comment: 'Refuted: status bar is deliberately hidden in a short landscape fold'
- id: design-attention-drives-order-and-weight
  title: Let the computed attention ranking drive visual weight, not just order
  body: attentionScore already ranks the roster and attaches a reasons array. Currently that only affects sort order; every row still paints identically. The highest-attention row should be visually heaviest, so the eye lands where the data says to look.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-sdk-first-not-bespoke
  title: Build from SDK components before writing bespoke CSS
  body: gui-extra.css is gmsniff own 300-line sheet layered on the SDK. Any new visual work should first ask whether the SDK already ships the component (Panel, Row, StatTile, PhaseWalk, BarRow, SessionCard, FileGrid density) rather than growing the bespoke sheet -- and if the SDK lacks it, the fix belongs upstream in ../design, never hand-edited into gui/ds/.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-screenshot-before-after
  title: Capture a real before/after screenshot pair for the redesign
  body: A density or hierarchy claim is best witnessed visually. Capture the current state and the final state through the browser verb screenshot prefix so the change is inspectable, not just numeric.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-degenerate-zero-agents
  title: Design the zero-agent and single-agent roster states
  body: With 0 discovered agents, 1 agent, or all-idle, a grid built for 16 rows reads as broken rather than empty. Each degenerate count needs a deliberate rendering.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-upstream-vs-local
  title: Decide per change whether it belongs upstream in ../design or local in gui/
  body: A change to a shared primitive belongs in ../design and comes back through sync:ds; a change to gmsniff own chrome belongs in gui/. Getting this wrong either forks the SDK silently or leaves other consumers unfixed. Record the reasoning per change.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-degenerate-long-values
  title: 'Handle degenerate content: very long cwd paths, long instruction text, huge counts'
  body: Real data carries deep worktree paths and multi-KB instruction excerpts. Verify each renders without breaking the row, and that truncation names what it cut.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-theme-parity-light
  title: Verify every design change in BOTH themes
  body: --accent-ink resolves to a different tone per theme (#4E4200 light vs the lime on ink). Any new colour decision must be checked in both, since a tone that reads on ink can vanish on paper.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-many-agents-overflow
  title: Design the roster at fleet scale
  body: Live-state reports 16 projects here and the roster caps what it shows. At 50+ discovered projects the layout, the cap notice and the scroll behaviour all need to hold.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-focus-visible-preserved
  title: Preserve focus-ring and reduced-motion coverage through the redesign
  body: A universal :focus-visible rule and 20 reduced-motion blocks currently cover the app. A restyle that replaces components can silently drop both -- re-witness after, do not assume.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: pending
- id: design-topbar-width-collapse
  title: The topbar never spans the shell band at any width
  body: 'Measured: .app-topbar computes 268px inside a 782px viewport, and still only 224px at 1440/1280/1024 -- it never spans at any size. Row was lost from the first prd-add wave while the daemon was dropping dispatches; re-added so the fix carries a real ledger entry.'
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: completed
  witness: 'Root-caused by walking the live parent chain: gui/app.js wrapped the ds <header class=app-topbar> in its own .gm-row-full flex div beside the project select and connection chip, making the header one flex item among three so it shrank to content width -- 268px against a 782px viewport and still only 224px at 1440/1280/1024, i.e. it never spanned at any size, so not a small-window artifact. Fixed by making the slot the flex container (.gm-topbar-slot) with the header at flex:1 1 auto; min-width:0. Witnessed after: topbarW 782 === viewportW, spans true, all four panels rendering (agents 1739, events 17513, sessions 26812, overview 905), 1 main, 1 h1, zero page errors. The dead .gm-row-full class and its stale comment were removed and its phone-width rules retargeted to the new slot.'
  commit_comment: Make the topbar span the shell band
