- id: gui-consume-runtime-failures
  text: 'The GUI shows snapshot.errors, which is STRUCTURALLY always 0 because gm runtime failures carry neither ok:false nor err. Verified live: errors 0 while runtimeFailures reports wasm_panic 1 in the same payload. A panel displaying errors is displaying a number that can never be non-zero. Consume runtimeFailures and runtimeFailuresTotal instead, per-name and unranked.'
  witness: 'live /api/snapshot: errors 0, runtimeFailuresTotal 1, runtimeFailures {wasm_panic:1}'
