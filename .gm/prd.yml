- id: queue-depth-counts-permanently-unconsumable-spool-files
  note: 'RE-SCOPED with fleet-wide measurement. gmsniff''s spoolQueueDepth is CORRECT -- it counts real files -- but the number it produces is a phantom backlog on most agents, because the spool ABI is in/<verb>/<N>.txt while these are .md files no watcher will ever consume. Measured across six live projects: gm queued=19 of which 19 are .md (its ENTIRE displayed backlog is residue), gmsniff 12 of 12 .md dated 2026-07-23 (five days stale), aloop 3 of 3, casey 2 of 2, looper 0 of 0, and only spoint has genuine work (33 queued, just 2 .md). So four of six agents display a queue depth that can never reach zero, and an observer cannot tell a real backlog from dead residue -- exactly the plausible-wrong-number class this session has been closing, on the manager view''s own headline row. The verb is not retired (not in RETIRED_VERBS) and works fine: out/ holds 38 memorize-* responses, so only these specific files are unconsumable. Report the measurement rather than inventing a verdict: count ABI-consumable entries separately from unconsumable ones, or surface the oldest entry''s age beside the count so five-day-old residue reads as residue. Do NOT delete another project''s spool input from this repo.'
  status: completed
  witness: 'spoolQueueDepth now returns {total, consumable, unconsumable, oldest_unconsumable_age_ms} and the manager view renders the split with the residue''s age. queue_depth was deliberately KEPT numeric because five surfaces already read it as a count (cli.js:853, cli.js:1433, registry.js:827, server.js:1756 and the project-signals route doc); changing its type under them would have broken all five, so the breakdown rides alongside. The fix also CORRECTED MY OWN MEASUREMENT: I had recorded spoint as the one project with genuine work (33 queued, only 2 dead), but the real render shows spoint at ''0 pending, 34 unconsumable (oldest 1308h29m)'' -- 54 days of residue. Every single agent reports 0 pending, so the manager view''s queued column has never once shown a real backlog: gm 19 unconsumable (228h), rs-plugkit 20 (236h), gmsniff 12 (113h), thebird 2 (1125h59m). Witnessed all three cases on the real CLI: with a genuine .txt waiting it renders ''queued: 1 pending, 12 unconsumable (not .txt, oldest 113h48m)''; with none, ''0 pending, 12 unconsumable''; and looper, whose queue is truly empty, renders NO queued line at all rather than a zero-split. No file in any other project was touched. node test.js exit 0.'
  commit_comment: Split the queued count into pending versus unconsumable residue with its age
- id: witness-queue-depth-split-across-real-and-residue
  note: 'Boundary discipline for the queue-depth fix, same as every cap this session. Witness on a project whose queue is ENTIRELY residue (gm: 19 of 19 .md, or gmsniff: 12 of 12), on one with genuine pending work (spoint: 33 queued with only 2 .md), and on one with an empty queue (looper: 0) which must not render a residue notice or a bare zero-split. Run the real CLI --agents and read its stdout rather than inspecting the render code. The count an observer acts on must let them distinguish ''this agent has 33 dispatches waiting'' from ''this agent has 19 dead files that will never be consumed'' -- if the fixed output still reads identically for gm and spoint, the fix failed regardless of what fields were added.'
  status: completed
  witness: 'All three boundary cases witnessed by running the real CLI and reading stdout, never by inspecting the render. (1) Entirely residue: gm renders ''queued: 0 pending, 19 unconsumable (not .txt, oldest 228h34m)'', gmsniff ''0 pending, 12 unconsumable (oldest 113h48m)'', rs-plugkit 20 at 236h, thebird 2 at 1125h59m. (2) Genuine pending work: the row''s premise that spoint had it was WRONG -- spoint renders ''0 pending, 34 unconsumable (oldest 1308h29m)'' -- so I created the case deterministically instead, writing a real .txt into an unserved verb dir, which rendered ''queued: 1 pending, 12 unconsumable'' and returned to ''0 pending'' on removal. A first attempt using a served verb was consumed faster than the render could catch it, which is why the unserved-dir version was needed. (3) Empty queue: looper renders NO queued line at all, not a bare zero-split. The row''s own pass condition -- that gm and spoint must no longer read identically -- is met: gm shows 19 unconsumable at 228h and spoint 34 at 1308h, both plainly residue rather than backlog, where before both were a bare ''queued: N spool request(s)''.'
  commit_comment: Witness the queue split on all-residue, genuinely-pending, and empty queues
