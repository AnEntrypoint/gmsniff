- id: probe-store-write-recovered
  note: Probe row testing whether plugkit's store write path has recovered after the failures observed in the prior walk. If this row lands, the store is writable and PRD state is trustworthy again; it will be resolved or removed immediately.
  status: completed
  witness: 'Probe succeeded, so the store write path has recovered and PRD state is trustworthy again. The prior walk saw five consecutive write failures (prd-add 10061/10062/10063, mutable-add 10065/10066) with reads working throughout, and isolated the cause to plugkit''s wasm store rather than the filesystem: a fresh spool boot did not clear it, removing a 542-minute-stale .gm/gm.db.lock/ did not clear it, disk had 140GB free, and both fs.writeFileSync and registry.js atomicWriteFile succeeded directly on .gm/prd.yml. This probe row was written and read back cleanly ({added: probe-store-write-recovered}, 1 row on disk), so the failure was transient and is now gone -- which is why it was retested rather than inherited as a standing blocker.'
- id: agents-panel-no-subheadings
  title: The primary panel has no sub-headings (h2=0)
  body: 'Measured live: #panel=agents renders h2=0 while deviations and overview each carry 3 and sessions/days/live carry 1. The manager view is the primary product surface and the one panel with no internal heading structure, so a screen-reader user cannot navigate within it and a sighted reader gets no sectioning between the attention strip, the controls and the roster.'
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: pending
- id: live-stream-empty-state-thin
  title: The live stream panel renders 82 chars total
  body: 'Measured live: #panel=live produces 82 characters -- the thinnest surface in the app by an order of magnitude (next thinnest is days at 262). Verify what a reader actually sees when no events are streaming and whether the panel states which zero it is, the same discipline the roster empty states already follow.'
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: pending
- id: panel-chrome-inconsistent
  title: Panel chrome differs across the eight panels
  body: 'Measured live: control counts run 0 (days) / 1 (sessions, deviations) / 2 (tree, live) / 5 (overview) / 9 (agents, events), and h2 counts run 0 to 3. A reader moving between panels re-learns the layout each time. Establish which chrome every panel should carry and which is genuinely panel-specific.'
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: pending
- id: events-table-density-mode
  title: Give the events table the same density control the roster got
  body: The roster gained a compact/comfortable density this session (208px -> 37px) and the events table has the same problem at larger scale (101 rows, up to 178px each). Decide whether the SDK Table gains a density prop the way SessionCard did, so the fix lands once for every consumer rather than per-panel.
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: pending
- id: events-row-height-nonuniform
  title: Events table renders 26 columns into 782px, shattering every row to 104-290px
  body: 'Re-measured properly and the first reading understated it: ALL 100 rows are over 40px, not three of them, across 7 distinct heights (104, 178, 216, 234, 253, 271, 290px). Root cause is not a single long value -- it is column count. The table renders 26 columns into a 782px viewport, so a cell gets roughly 30-46px of width, and with word-break:break-all a 7-character value wraps to a 178px-tall column of single characters. Measured directly: tallestCell w=46 len=7 h=178 wordBreak=break-all. The fix is not row styling; it is deciding which of the 26 columns a reader actually needs at a given width, because no per-row rule can rescue a 46px column.'
  status: completed
  witness: 'Root-caused to COLUMN COUNT, not row styling. The table built its column set from the union of every key across all rows: measured 32 distinct keys on a real 100-row page, of which 17 appear on under 10% of rows (several on exactly one), yet each claimed a full column for all 100. At 26 rendered columns in a 782px viewport a cell gets 30-46px, and a 7-character value wrapped into a 178px stack of single characters -- ALL 100 rows measured over 40px, across 7 heights (104-290px). renderEventTable now selects columns by population (>=50% of rows), names the held-back fields in a notice, and carries each row own sparse values in a detail cell so nothing becomes unreachable. Measured after: 26 columns -> 9, heights 104-290 -> 48/67, median 178 -> 67, bodyOverflows false, zero page errors. Two CSS attempts measured WORSE and were reverted with their numbers recorded in the sheet: word-break:normal+overflow-wrap:break-word (median 67 -> 160, panel scrolling horizontally, because a long cwd path then cannot break at all) and adding min-width:64px (same outcome).'
  commit_comment: Select event-table columns by population, not by key union
