- id: surface-nextstep-vs-turnstate-divergence
  text: 'The CLI drilldown detected and reported a real inconsistency on C:/dev/spoint: next-step.md still shows PLAN while turn-state.json has moved to EXECUTE, meaning the served prose on disk lags the actual FSM state. This divergence is a genuine observable condition and should be surfaced everywhere phase is shown, including the GUI, rather than silently preferring one source. It also validates reading turn-state.json as primary with next-step.md as the prose fallback.'
  witness: 'real run of node src/cli.js --agents --agent spoint: instruction line reads next-step.md still on PLAN, turn-state has moved to EXECUTE'
  status: pending
- id: skill-lags-phase-in-turn-state
  text: Real drilldown on C:/dev/casey shows phase PLAN with skill update-docs -- update-docs is the COMPLETE-phase skill, so last_skill lags the current phase rather than describing it. turn-state.json last_skill records the skill that ran most recently, NOT the skill for the current phase. Label it accordingly in every surface (last skill, not current skill) or derive the current-phase skill from the FSM graph instead, otherwise it reads as a contradiction.
  witness: 'real run of node src/cli.js --agents --agent casey: phase PLAN for 5h22m with skill update-docs'
  status: pending
- id: phase-held-far-beyond-normal
  text: Real data shows an agent holding PLAN for 5h22m while its instruction was re-served only 3m48s ago and its last event was 1m32s ago -- active but not advancing. A live manager should flag a phase held far beyond its typical duration as an attention signal, since it is invisible when only liveness is shown. This is a concrete input to agent-attention-ranking.
  witness: 'real drilldown: casey PLAN for 5h22m, instruction served 3m48s ago, last event 1m32s ago'
  status: pending
- id: gui-has-no-test-coverage-asymmetry
  text: 'test.js pins /api/project-signals against ever attaching a severity, but NO test covers the GUI side -- and that asymmetry is exactly how a ten-term attention score and a row-dropping filter survived client-side while the server was locked down. The server is guarded by assertions; the client is guarded only by whoever happens to look. Closing it needs a DOM, which the zero-dependency no-test-framework constraint makes non-trivial, so the design question is real: either assert against the served module exports without a DOM, or accept that the browser witness is the only client guard and make that explicit rather than implicit.'
  witness: server agent added the project-signals no-severity assertion; the same class of defect then appeared unguarded in gui/app.js and gui/live-agents.js
  status: pending
- id: rotation-detected-only-by-shrink
  text: 'ProjectLogTailer detects rotation by stat.size < offset, so it recovers only when the replacement file is STRICTLY SMALLER. Real probe: rewriting a 110-byte log with 77 bytes correctly picked up the new event, but rewriting a log with same-or-greater size left stat.size >= offset, the reset never fired, and the new content was silently missed -- the tailer kept reading from a stale offset into unrelated bytes. Size is the wrong rotation signal: use the file identity (inode/ino on posix, or a birthtime/ino pair) or compare a leading-bytes fingerprint, so a rotation that happens to produce an equal-or-larger file is still detected.'
  witness: 'real probe: 110->77 bytes recovered (saw after-rotate); equal-size rewrite saw only the pre-rotation event'
  status: pending
