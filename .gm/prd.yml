  text: node_modules/playwright-core is present on disk despite zero declared dependencies. It is not in the published tarball and not imported by src/, so shipped users are unaffected, but it muddies the zero-dependency invariant locally and should be removed or explained.
  witness: docs agent found it while verifying the zero-dependency property
  status: pending
- id: drop-removed-cli-flags-from-docs
  text: The old README documented --spool-queue, --watcher-versions and --instruction-tiers, which now return unknown flag; the equivalent /api/* routes are still live. Docs were corrected to describe them as server routes only -- verify no other surface still advertises them as CLI flags.
  witness: 'docs agent: the three flags return unknown flag while the routes remain in server.js'
  status: pending
- id: parse-dispatch-completion-lines
  text: 'ROOT CAUSE of the unmodeled residual and the dispatch imbalance. The watcher log carries BOTH [dispatch] -> (start) AND [dispatch] <- (completion) text lines, and only the start form is parsed. Real counts: spoint 14888 start / 14777 end, gmsniff 1694 / 1681, casey 3511 / 3466. The completion line is RICHER than the dispatch.end evt record because it carries out= response bytes as well as ms=, e.g. [dispatch] <- verb=instruction task=3 ms=3876 out=16855b. Parse it, pair it to its start by task id, and expose response size per dispatch. This is roughly 14777 lines in spoint alone -- a large share of the 9.55% unmodeled residual.'
  witness: 'real count across 3 live projects: 20093 start lines vs 19924 completion lines, all currently ASCII <- and unparsed'
  status: pending
- id: expose-dispatch-response-size
  text: The [dispatch] <- completion line carries out=<n>b response bytes, a signal available nowhere else. Surface per-dispatch response size so an observer can spot a verb returning an unexpectedly large or empty payload, which is a real failure mode for instruction and codesearch dispatches.
  witness: 'real sample: [dispatch] <- verb=instruction task=3 ms=3876 out=16855b'
  status: pending
- id: correct-dispatch-imbalance-diagnosis
  text: The earlier reading that ends outnumber starts (51203 start vs 53948 end) was an artifact of comparing text-derived dispatch.start against the separate dispatch.end evt records, two different populations. Real like-for-like pairing of the text lines shows starts slightly EXCEED ends -- 169 orphan starts across 3 projects (spoint 111, gmsniff 13, casey 45) -- which is exactly the expected shape for in-flight and interrupted dispatches. Pair start to completion by task id and treat a small orphan-start count as normal in-flight, not as corruption.
  witness: 'real per-project counts: start 20093, completion 19924, delta +169'
  status: pending
- id: skill-lags-phase-in-turn-state
  text: Real drilldown on C:/dev/casey shows phase PLAN with skill update-docs -- update-docs is the COMPLETE-phase skill, so last_skill lags the current phase rather than describing it. turn-state.json last_skill records the skill that ran most recently, NOT the skill for the current phase. Label it accordingly in every surface (last skill, not current skill) or derive the current-phase skill from the FSM graph instead, otherwise it reads as a contradiction.
  witness: 'real run of node src/cli.js --agents --agent casey: phase PLAN for 5h22m with skill update-docs'
  status: pending
- id: phase-held-far-beyond-normal
  text: Real data shows an agent holding PLAN for 5h22m while its instruction was re-served only 3m48s ago and its last event was 1m32s ago -- active but not advancing. A live manager should flag a phase held far beyond its typical duration as an attention signal, since it is invisible when only liveness is shown. This is a concrete input to agent-attention-ranking.
  witness: 'real drilldown: casey PLAN for 5h22m, instruction served 3m48s ago, last event 1m32s ago'
  status: pending
- id: source-explicit-flags-self-contradict
  text: /api/source simultaneously reports explicit_log_dir:true and sources.gm_log.explicit:false in the same payload for the same directory. Two flags describing one fact disagree, so neither can be trusted by a consumer. Reconcile to a single derived value.
  witness: real /api/source payload from a default GUI launch
  status: pending
- id: single-writer-collision-on-gui-forcegraph
  text: 'Real single-writer collision observed: edits to gui/forcegraph.js were overwritten wholesale by the concurrent agent that owns gui/, reverting a completed comment pass (named functions, renamed constants, trimmed header). Confirms the discipline -- per-file ownership must be respected even for a small isolated file, and a second writer should hand the change to the owner rather than applying it directly.'
  witness: gui/forcegraph.js mtime 18:48 with zero occurrences of the extracted function name written minutes earlier
  status: pending
