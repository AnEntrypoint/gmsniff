- id: cli-and-gui-disagree-on-the-same-facts
  note: 'Captured within seconds of each other from the same data: CLI --agents printed ''2 shown / 70 discovered'' while the GUI banner printed ''6 working agents'' and ''6 shown / 6 reported by live-state'', and the GUI listed gm/aloop/casey/looper as rows the CLI had folded into ''68 idle/abandoned/COMPLETE agent(s) hidden''. Two surfaces over one dataset giving different totals and different membership, with no way for a reader to tell which is right. Define ONE vocabulary for the counts (discovered / working / running / idle / hidden) and make both surfaces report the identical numbers from the identical predicate, each naming what it omitted.'
  status: completed
  witness: 'Two distinct causes, both fixed. (1) The real disagreement was a DUPLICATED implementation: src/cli.js carried its own next-step.md first-heading scan (line 1371), so fixing the ORCHESTRATOR defect in src/registry.js corrected the GUI while the CLI kept printing ORCHESTRATOR for every project -- two surfaces reading one file and disagreeing about it. Deleted the duplicate and imported readLivePhaseState, the same function the GUI path uses, so the two cannot drift again. Witnessed: `node src/cli.js --agents` now prints ''PLAN'' where it printed ''ORCHESTRATOR'', and shows ''gmsniff EXECUTE ... PLAN (served 39m11s ago)'' -- the identical served-vs-authoritative divergence the GUI card surfaces for the same project. (2) The counts were measured and are NOT in conflict, only under-labelled: /api/projects reports 173 rows with alive=3, live-state reports 7 live agents as 3 dispatching + 4 idle, and the CLI''s ''shown'' is 3 -- the 3 agree exactly across all three surfaces. The CLI''s own walk and the server''s discoverProjectsCached scan different roots (70 vs 173), so the bare word ''discovered'' was the ambiguity rather than the numbers; the CLI header now reads ''3 working / 70 with gm state on disk'', naming its population the way the GUI line already named ''reported by live-state''. Hidden counts still printed on both. node test.js exit 0.'
  commit_comment: Share one instruction extractor between CLI and GUI and name each count's population
- id: keep-gui-escaping-verified-under-hostile-values
  note: 'Witnessed PASSING and worth keeping verified rather than assumed: navigating the GUI to #panel=tree&sess=<img src=x onerror=window.__xss=1> produced xss_fired false, injected_img false, and no literal onerror handler anywhere in document.body.innerHTML -- the sess value is escaped on render even though /api/process-tree echoes the raw string back in its JSON. Any presentation rework that changes how event details, instruction text, prompts or project names reach the DOM must re-run this check, because the drained/reshaped render path is exactly where an escape gets dropped. Event detail strings now come from arbitrary gm output (error/reason fields), so they are the highest-risk new sink.'
  status: completed
  witness: 'Re-verified after this walk changed how event details reach the DOM, which was the point of keeping the row. Two hostile values through URL-driven state: sess=<img src=x onerror=window.__xss1=1> on the tree panel and filter=<svg onload=window.__xss2=1> on the agents panel -- both returned xss false, injected-element false, and no literal handler in document.body.innerHTML. A first pass reported detail_lines_rendered 0, meaning it had NOT actually exercised the sink my changes touched (the event-detail path lives in the drilldown feed, not the panel text I sampled), so rather than accept an inferred pass I opened the drilldown: 88 feed lines rendered through the new eventDetailText path, including dispatch.end lines carrying real values (''10100 browser'', ''124 prd-add''), with unescaped_injected false and zero raw <img/<svg/<script sequences in the HTML. The detail strings now come from arbitrary gm output fields (error, reason, summary, path, model, sha) that were never rendered before this walk, and they are escaped correctly.'
  commit_comment: Re-verify DOM escaping through the changed event-detail render path
- id: needs-attention-list-restates-without-adding
  note: The live-agents panel renders a 'Needs attention:' block listing 'aloop -- idle mid-chain', 'gmsniff -- dispatching now', 'gm -- dispatching now'. Two of the three reasons are 'dispatching now', which is the healthy state and the opposite of needing attention, and every named project already appears in the cards below with its full phase and timing. The block consumes prime vertical space above the fold to restate rows the reader is about to see, with a label that miscategorises normal activity as a problem. Either make it surface only what the cards do NOT already show (a genuine anomaly with its measurement) or remove it -- a heading that promises triage and delivers a duplicate roster costs more attention than it saves.
  status: completed
  witness: 'The strip rendered attention.reasons[0] for the top-ranked agents regardless of what that reason said, and ''dispatching now'' is pushed for every live===''active'' agent -- so a heading promising triage listed healthy agents, measured live as 2 of 3 entries reading exactly ''dispatching now''. Enumerated all eight reasons in gui/shared.js attentionScore rather than inventing a severity: seven describe something anomalous (blocked by gates, dispatch never completed, deviation rate rising, verb running Nx its median, PRD backlog growing, idle mid-chain, next-step.md unparseable) and exactly ONE describes the healthy state. Exported that one as REASON_DISPATCHING_NOW so the filter keys on a shared constant instead of a magic string, and the strip now shows each agent''s first ANOMALOUS reason, skipping agents whose only reason is that they are working. No new severity was minted, the ranking still counts dispatching (a working agent still sorts high), and every agent remains fully visible in the cards. Witnessed in the real browser (browser-9410): the strip reads ''rs-plugkit -- idle mid-chain'' and ''aloop -- idle mid-chain'', dispatching_in_attention false, all 7 cards still rendering, zero page errors -- which also proves the cross-module import resolved, since an undefined import would have thrown at module load.'
  commit_comment: Show only anomalous reasons in the needs-attention strip
- id: card-repeats-cwd-phase-and-agent-name-redundantly
  note: 'Each agent card renders, in order: name (gmsniff), RUNNING, ''gm'', ''ORCHESTRATOR'', the full absolute cwd (C:\dev\gmsniff), the phase (PLAN), then ''9m 31s - prd 0/0 - mut 0'' and ''last event 45s ago''. The name and the cwd basename are the same fact twice; ''gm'' is constant across every card and carries nothing; ORCHESTRATOR is the prose heading covered by its own row. That is roughly half the card''s lines spent before reaching the first distinguishing measurement. Restructure so the scanning order matches what an observer actually needs -- which agent, what phase, how long, how stale, what it is doing -- with the constant and duplicated fields removed or demoted to the drilldown.'
  status: completed
  witness: 'Two redundancies removed, the second discovered by witnessing the first. (1) The ds `agent` badge was fed p.skill || ''gm'', which resolves to the constant ''gm'' on every project on the machine, so the badge carried nothing; it now carries the authoritative phase. Witnessed: bare-''gm'' badge lines fell to 1, and that one is the project literally NAMED gm. (2) That change then exposed a redundancy it created -- with the phase in the badge, spoint rendered EMIT / serving EMIT / EMIT, the same word three times on one card. The served heading only carries information when it DISAGREES with turn-state.json, so servedSectionLabel now returns null when they agree. Witnessed in the real browser (browser-9413): spoint and gm render no serving line at all, while gmsniff shows ''serving PLAN'' above phase ''EXECUTE'' -- the real lag, surfaced exactly where it exists and nowhere else; only 2 distinct serving values remain across 7 agents. All 7 cards still render. The absolute cwd was deliberately KEPT rather than trimmed to a basename: discovery finds same-named projects under different trees (C:/dev/babspoint/.claude/worktrees/... paths appear in the roster), so the path disambiguates them and is not duplicate information. gui/ds/ was not touched -- it is vendored and hand-editing it would be reverted by the next sync.'
  commit_comment: Put the phase in the card badge and drop the served line when it agrees
