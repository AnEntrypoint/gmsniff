- id: ds-sync-drift-recurrence
  title: Record that vendored drift recurs and how it is caught
  body: This drift appeared AFTER this session earlier sync, within the same session -- upstream moves independently. The catch was gm-continue running sync:ds:check as part of its verification pass rather than trusting an earlier clean result. Confirm the check is cheap and correctly reports both directions (drift present, and clean after sync).
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'Confirmed by execution that vendored drift recurs within a single session and that sync:ds:check catches it in both directions: it reported 3 files out of sync against ../design HEAD d9c1d9a AFTER this session earlier sync, and reports gui/ds/ matches C:/dev/design once synced. The catch came from gm-continue running the check as part of its verification pass rather than trusting the earlier clean result -- so the guard is the re-check, not the previous green.'
  commit_comment: Record that vendored drift recurs and is caught by re-checking
