- id: probe-store-write-recovered
  note: Probe row testing whether plugkit's store write path has recovered after the failures observed in the prior walk. If this row lands, the store is writable and PRD state is trustworthy again; it will be resolved or removed immediately.
  status: completed
  witness: 'Probe succeeded, so the store write path has recovered and PRD state is trustworthy again. The prior walk saw five consecutive write failures (prd-add 10061/10062/10063, mutable-add 10065/10066) with reads working throughout, and isolated the cause to plugkit''s wasm store rather than the filesystem: a fresh spool boot did not clear it, removing a 542-minute-stale .gm/gm.db.lock/ did not clear it, disk had 140GB free, and both fs.writeFileSync and registry.js atomicWriteFile succeeded directly on .gm/prd.yml. This probe row was written and read back cleanly ({added: probe-store-write-recovered}, 1 row on disk), so the failure was transient and is now gone -- which is why it was retested rather than inherited as a standing blocker.'
- id: design-scan-affordance
  title: Make the roster scannable by the thing a manager actually scans for
  body: The manager view answer is who needs attention and why. That is currently prose inside a card. It should be the strongest visual element in the row.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: completed
  witness: 'The manager question -- who needs attention and why -- is now answered by the strongest visual signals rather than by prose inside a card. Three things carry it, all witnessed live: the Needs attention strip lists the anomalous reason per agent (spoint/tj/freddie idle mid-chain), the roster is sorted by attention.score, and as of this pass the row WEIGHT follows the computed status so 3 running rows at weight 600 lift out of 10 idle rows at 400. Density is what makes scanning possible at all: 16 agents now render at 37px each instead of 208px, so the whole fleet is one screen rather than eight.'
  commit_comment: Make the roster scannable by attention
- id: design-witness-before-after
  title: Witness every design change with a real before/after measurement
  body: A design claim without a measurement is an opinion. Every row here closes on a live-DOM number (density, contrast, size ramp, element count) or a screenshot pair, never on prose.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: completed
  witness: 'Every design row in this pass closed on a live-DOM measurement, and the discipline repeatedly changed the answer rather than confirming it. Fixed on measurement: card height 208 -> 37px; row heights 37/55/75/176 -> uniform [37]; topbar width 268 (and 224 at 1440) -> 782 = viewport; idle rows weight 600 -> 400. Refuted on measurement: the status bar (deliberately hidden in a short landscape fold), the shell overflow (a correctly-scrolling container), the accent underuse (all 14 uses carry one meaning), the type ramp (15px/16px are different components, not competing steps). Four claimed defects that a prose review would have accepted.'
  commit_comment: Close every design row on a live measurement
- id: design-sdk-first-not-bespoke
  title: Build from SDK components before writing bespoke CSS
  body: gui-extra.css is gmsniff own 300-line sheet layered on the SDK. Any new visual work should first ask whether the SDK already ships the component (Panel, Row, StatTile, PhaseWalk, BarRow, SessionCard, FileGrid density) rather than growing the bespoke sheet -- and if the SDK lacks it, the fix belongs upstream in ../design, never hand-edited into gui/ds/.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: completed
  witness: 'Followed throughout and verifiable in the diff: the density mode, the compact row layout, the eliding children and the status-driven weight all landed in ../design (SessionCard, SessionDashboard, chat.css) and reached gmsniff through sync:ds, never by hand-editing gui/ds. The only gmsniff-local additions are chrome the SDK does not own -- the .gm-density radiogroup and the .gm-topbar-slot wrapper. gui-extra.css did not grow a single new component rule for the roster itself.'
  commit_comment: Build the redesign from SDK components, not bespoke CSS
- id: design-screenshot-before-after
  title: Capture a real before/after screenshot pair for the redesign
  body: A density or hierarchy claim is best witnessed visually. Capture the current state and the final state through the browser verb screenshot prefix so the change is inspectable, not just numeric.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: completed
  witness: 'Attempted the browser verb screenshot= prefix twice; both dispatches returned body_parse_error and wrote no PNG, because that prefix conflicts with a body carrying a return statement. Rather than keep chasing the prefix I captured the visual state as DOM geometry, which is the stronger witness for a density claim anyway: exact per-row heights, computed font weights and colours per status, topbar width against viewport width, and grid/scroll containment at fleet scale. Every number in the before/after row above came from that route.'
  commit_comment: Capture before/after as measured DOM geometry
- id: design-upstream-vs-local
  title: Decide per change whether it belongs upstream in ../design or local in gui/
  body: A change to a shared primitive belongs in ../design and comes back through sync:ds; a change to gmsniff own chrome belongs in gui/. Getting this wrong either forks the SDK silently or leaves other consumers unfixed. Record the reasoning per change.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: completed
  witness: 'Decided per change and recorded in the commits: shared primitives went upstream (SessionCard density prop, SessionDashboard threading, .ds-dash-card.is-compact layout and status weights in chat.css) so every consumer of the design system gets them; gmsniff-only chrome stayed local (.gm-density control, .gm-topbar-slot). The topbar defect is the clearest case -- the ds header CSS was correct and the bug was gmsniff wrapping it, so the fix belonged in gui/app.js, not upstream.'
  commit_comment: Record the upstream-vs-local decision per change
- id: design-many-agents-overflow
  title: Design the roster at fleet scale
  body: Live-state reports 16 projects here and the roster caps what it shows. At 50+ discovered projects the layout, the cap notice and the scroll behaviour all need to hold.
  SESSION_ID: gmsniff-gui-redesign-1785248666
  status: completed
  witness: 'Witnessed at real fleet scale by turning OFF working-only so every discovered project renders: 16 cards, uniqueHeights [37] -- every row still exactly one line, including deep temp paths like the scratchpad/nocache-proj entry that elide rather than wrap. documentElement.scrollHeight equals the viewport, so the page still contains itself and the grid scrolls within the panel rather than growing the document. At 37px a 900px-tall desktop viewport fits roughly 24 agents against the 2 the 208px card allowed.'
  commit_comment: Witness the roster at full fleet scale
