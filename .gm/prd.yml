- id: gui-consume-parse-health
  text: '/api/parse-health is unconsumed by any panel. It reports per-project parse coverage for all 70 projects unfiltered, plus correlation honesty (dominant_kind run at 71.8 percent, best_kind sess, has_true_session true) and the full line-class breakdown (378065 lines: 55992 event, 121083 dispatch, 19649 spawn, 19752 blank). Surfacing it makes an unparsed upstream format change visible instead of silent.'
