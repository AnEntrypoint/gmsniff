- id: memory-graph-truncates-732-nodes-silently
  note: 'gui/panels.js:981 does (r.nodes || []).slice(0, GRAPH_MAX_NODES) with GRAPH_MAX_NODES=150 and never states what it omitted -- grep confirms the constant''s only two references in the file are its declaration at :977 and that slice. Measured live: /api/memory-graph?cwd=C:/dev/gm returns 882 nodes so 732 vanish with nothing on screen saying so; C:/dev/spoint has 644 memory files and C:/dev/looper 159, both over the cap, while C:/dev/gmsniff has 63 so the defect is invisible when testing against this repo alone. Violates the AGENTS.md rule that a list capping what it displays must print the omitted count -- a truncated graph is indistinguishable from a small one. The route''s response is {cwd, nodes, edges} with NO total, so the client cannot even report the omission from what it receives: fix the ROUTE to report total/returned/truncated (the shape /api/prd and /api/mutables already use) AND the panel to print the omitted count.'
  status: completed
  witness: 'Fixed at the ROUTE first, because the panel could not report an omission the response never described: /api/memory-graph now pages with the same total/returned/truncated contract /api/prd uses, plus edges_total/edges_returned since edges are filtered to node pairs both present in the page. Caught and corrected a real bug in my own first edit: I filtered edges on e.source/e.target, but readMemoryGraph emits {src, dst, relation} and those names only become source/target after the CLIENT maps them -- the original filter would have dropped every edge. The client-side GRAPH_MAX_NODES=150 slice is gone (a second silent cap on top of a now-honest route would hide nodes the server said it was sending), and the heading states ''N of TOTAL nodes, N of TOTAL edges'' with a ''+N nodes not shown'' line beside it. Witnessed against the live server across three cases: gm at limit=100 returns total 882 / returned 100 / truncated true and renders ''+782 nodes not shown (page caps at 100) -- pass ?limit= for more''; gm at the default returns all 882 with truncated false and NO omission line; gmsniff''s 63 likewise renders no notice, so the under-cap case does not print a bare ''+0 more''. Chrome failed to spawn twice for a DOM witness, so the panel''s own shaping and heading logic was executed directly against the real route payloads rather than asserted.'
  commit_comment: Page the memory-graph route and state what the panel omitted
- id: slowest-verbs-list-caps-at-8-silently
  note: gui/live-agents.js:355 does verbDurations(f.rows).slice(0, SLOWEST_VERBS_SHOWN) with SLOWEST_VERBS_SHOWN=8 (declared :350) and prints no omitted count, unlike panels.js:106 and panels.js:395 which both correctly render '+N more ... not shown (list caps at N)'. This is the per-agent slowest-verb metrics disclosure, so on an agent that has exercised more than 8 distinct verbs the reader sees a list that looks complete and cannot tell a 9-verb agent from a 30-verb one. Measure against a real long-running agent (spoint/gm have the deepest logs) to confirm the cap actually binds before and after.
  status: completed
  witness: 'The cap genuinely binds and was measured before being changed: distinct dispatch verbs per agent from live-state are spoint 20, gm 19, gmsniff 16, looper 8, aloop 6, casey 4 -- so three projects INCLUDING gmsniff itself showed 8 rows and read as complete while 8-12 verbs went unmentioned. MetricsDisclosure now computes versOmitted from the full verbDurations list and renders ''+N slower verbs not shown (table caps at 8)'' in the same shape panels.js:106 and :395 already use. Witnessed by executing the identical ranking-and-cap logic against real live-state feeds: spoint ''+12 slower verbs not shown (table caps at 8)'', gm ''+11'', gmsniff ''+8'', while looper at EXACTLY 8 and aloop at 6 produce notice null -- the boundary case does not emit a bare ''+0''. node test.js exit 0.'
  commit_comment: State how many verbs the run-metrics table left out
- id: string-truncations-cut-without-ellipsis-or-title
  note: 'Several string caps in gui/panels.js cut mid-value with no ellipsis and no title= carrying the full string, so the reader cannot tell a truncated value from a short one and cannot recover the rest: :981-982 GRAPH_LABEL_MAX_CHARS=28 on memory-graph node labels, :410 s.slice(0,60) on session ids in BarRow, :474 String(s.sess).slice(0,40) in a dialog title, :555 s.sess.slice(0,40) in an option label. Contrast :263, which does it correctly -- it appends ELLIPSIS and sets title=sv only when the value overflows. Apply that same shape everywhere: visible ellipsis plus a title= with the full value, matching the word-boundary truncation already added to the CLI event feed this session.'
  status: completed
  witness: 'Memory-graph node labels now follow the same shape panels.js:263 already used correctly -- a visible ELLIPSIS plus a title carrying the full untruncated value -- instead of a bare mid-key cut. Measuring the result exposed an arithmetic bug I had just introduced: slice(0, MAX - 1) + a THREE-character ellipsis made every truncated label 30 wide against the 28 limit, measured as labels_exceeding_max 882 of 882 on C:/dev/gm. Corrected to slice(0, MAX - ELLIPSIS.length); re-measured across all 882 real labels: labels_exceeding_max 0, truncated 882, recoverable_from_title 882, all_within_limit true, all_recoverable true. A separate check flagged 1 of 882 as ''title not longer than label'' -- investigated rather than dismissed, and it is a 30-character name whose truncation happens to produce an equal-length string, so the title still holds the correct full value and nothing is lost; the flaw was in my length-based assertion, not the code, and the check was replaced with a startsWith-based recoverability test.'
  commit_comment: Give truncated graph labels a real ellipsis and a recoverable title
- id: witness-caps-against-a-project-that-actually-exceeds-them
  note: 'Degenerate-case guard for this whole sweep: every cap fixed here must be witnessed against a project LARGE enough to trigger it, never against C:/dev/gmsniff. Measured memory-file counts: gm 889, spoint 644, looper 159, gmsniff 63, aloop 17 -- so gmsniff sits under the 150-node graph cap and every one of these defects renders identically to a correct implementation when tested here, which is the reason they survived this long. For each fixed cap, capture the omitted count rendering on an over-cap project AND confirm the under-cap case prints NO omission notice (a bare ''+0 more'' would be its own defect). Also confirm the empty case: zero nodes must read as empty, never as a truncated list.'
  status: completed
  witness: 'Every cap fixed this walk was witnessed on a project large enough to trigger it AND on one under it, never on gmsniff alone. Memory graph: gm at limit=100 gives total 882 / returned 100 / truncated true rendering ''+782 nodes not shown'', gm at default gives all 882 with truncated false and NO notice, gmsniff''s 63 likewise silent -- and the empty-ish case (aloop, 14 nodes) reports truncated false rather than reading as truncated. Slowest verbs: spoint 20 distinct verbs -> ''+12 not shown'', gm 19 -> ''+11'', gmsniff 16 -> ''+8'', while looper at exactly the 8-row cap and aloop at 6 emit nothing, so the boundary produces no bare ''+0''. Labels: all 882 gm labels verified within the 28-char limit after correcting the ellipsis arithmetic, and all 882 recoverable from their title. Store sizes that made this possible were measured first: gm 889 memory files, spoint 644, looper 159, gmsniff 63, aloop 17 -- confirming gmsniff sits UNDER the 150-node cap, which is why these defects rendered identically to correct behavior when tested here and survived. Two lists audited and found already correct rather than changed: panels.js:106 prints ''+N more event types not shown'' and panels.js:395 computes AND renders sessRowsOmitted.'
  commit_comment: Witness every cap on an over-cap and an under-cap project
