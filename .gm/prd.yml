- id: distinct-route-slices-without-reporting-total
  note: 'src/server.js:1419 does [...counts.entries()].sort(...).slice(0, limit) and /api/distinct returns {field, values} with NO total, so a caller cannot detect truncation. Measured against a live server: ?field=event&limit=9999 returns 56 distinct event types while the DEFAULT call returns 50, so 6 vanish silently. Identical to the defect already fixed on /api/memory-graph this session. Neighbouring routes are the model: :151 recallMisses, :185 classifierRejects, :229 embedFailures and :1256 all return total beside their sliced rows, and :1446 captures const total = arr.length BEFORE slicing. Add total/returned/truncated to distinct(), update the /api/distinct ROUTES doc entry, and check whether a GUI panel consuming it must surface the omitted count.'
  status: completed
  witness: 'distinctValues now returns {values, total, returned, truncated} instead of a bare array, and the route spreads it so /api/distinct carries the same contract /api/prd, /api/memory-graph and the neighbouring recallMisses/classifierRejects/embedFailures routes already use. The ROUTES doc entry was updated from ''{field, values: [{value, count}]}'' to the full shape with the reason. Checked every consumer before changing the return type: grep across src/*.js, gui/*.js and test.js finds distinctValues called from exactly one place (the route handler) and no GUI panel fetches /api/distinct at all, so the change is contained and `values` remains `values` for any external caller. Witnessed against the live server on four cases: ?field=event&limit=3 -> total 56, returned 3, truncated true; ?field=event&limit=9999 -> total 56, returned 56, truncated false; the DEFAULT ?field=event -> total 56, returned 50, truncated TRUE, which is the case that mattered because those 6 dropped values were previously invisible; and ?field=sub (2 distinct values, far under the cap) -> truncated false, so a complete list never carries a truncation flag.'
  commit_comment: Report total/returned/truncated from /api/distinct so a 50-of-56 result stops reading as complete
- id: audit-every-route-response-for-unreported-truncation
  note: 'Verification sweep the grep ratio cannot answer: check the ACTUAL JSON of every route that slices, not the source, because many slices are benign timestamp/id cuts (slice(0,19) on an ISO ts, slice(0,16) on a hash) rather than dropped list rows. Boot a real server, request each route with a limit small enough to force truncation and again with one above the real total, and assert the response either carries total/returned/truncated or provably cannot truncate. Routes to cover: /api/distinct, /api/events, /api/deviations, /api/sessions, /api/query, /api/search, /api/prd, /api/mutables, /api/memory-graph, /api/spool-queue, /api/watcher-versions, /api/instruction-tiers, /api/project-signals, /api/health-summary. Record which ones were already correct so the audit is a measurement rather than a list of edits.'
  status: completed
  witness: 'Audited 15 routes by requesting each on a live server with a limit small enough to force truncation and reading the ACTUAL JSON, never by grepping -- the grep ratio was misleading exactly as the row predicted, since many slices are benign timestamp/hash cuts. Result: 9 routes were already honest (events/deviations/sessions/throughput return total; prd/mutables/memory-graph return total+returned+truncated; health-summary returns total+returned), ONE was a real gap I fixed this turn (/api/distinct), and one MORE gap the audit itself surfaced that no row had named: /api/search returned a bare {q, results} while capping -- measured returning exactly 2000 on limit=99999. Its scan BREAKS at limit rather than counting on, so no true total exists without doubling work over every event; the honest fix is truncated/scanned_all rather than an invented total, and it now reports {returned:5, truncated:true, scanned_all:false} on limit=5 and {returned:0, truncated:false, scanned_all:true} on a term with no matches. The remaining five unsignalled routes were VERIFIED COMPLETE rather than assumed: event-types returns 56 which equals /api/distinct''s measured true total of 56, and project-signals returns 174 which equals the full /api/projects roster of 174, so a truncation field there would be noise reporting a cut that never happens. spool-queue (20), watcher-versions (171) and instruction-tiers (55) are likewise whole-set enumerations with no slice in their path. node test.js exit 0 (11517 events), and test.js:41''s Array.isArray(search.results) assertion still holds because results stayed an array.'
  commit_comment: Audit every route's real JSON for unreported truncation; fix /api/search, verify the rest
- id: memory-node-text-and-readtextfile-truncate-unsignalled
  note: 'Two CONTENT truncations that carry no signal, unlike instruction_preview at :2041 which is already correct (it ships instruction_truncated and instruction_length beside the preview -- that is the pattern to copy). (1) :354 readMemoryGraph pushes {key, text: body...slice(0, 500), namespace, mtime}: a memo longer than 500 chars is cut with nothing saying so, and the memory-graph panel shows that text on node select, so a reader cannot tell a truncated memo from a short one. (2) :376 readTextFile(fp, max = 8192) slices the file and returns the string bare, so every caller receives a possibly-cut file with no way to detect it -- enumerate its callers and decide per call whether the cut is reachable in practice before adding a signal. Judge each on whether the consumer can tell; do not add fields where nothing reads them.'
  status: completed
  witness: 'Judged the two sites separately rather than treating them as one defect. (1) readMemoryGraph node text WAS a real defect and the measurement decided it: 742 of C:/dev/gm''s 882 memory files exceed the 500-char preview (longest 3658), so 84% of nodes were cut with nothing saying so, and the panel shows that text on node select. Fixed with the same shape instruction_preview already uses in this file -- text_truncated and text_length beside the preview -- and the magic 500 became MEMORY_NODE_TEXT_PREVIEW_CHARS declared immediately above readMemoryGraph rather than 300 lines below its use. Witnessed against the live route on the real 882-node store: 698 nodes report text_truncated true with true text_length (longest 3560), 184 short memos report false, and a sampled node shows text_length 941 previewed at 500 with the flag set. (2) readTextFile was left ALONE deliberately: its three callers pass explicit small maxima for values that are previews by intent (:388 max 256, :500 max 512) or read a file whose size is not a display concern (:1996 last-prompt at 8192), and no consumer renders them as if complete -- adding a flag nothing reads would be noise, which the row itself asked me to avoid. node test.js exit 0 (11484 events).'
  commit_comment: Signal truncated memory-node text; leave readTextFile alone with the reason
- id: witness-distinct-cap-over-and-under-boundary
  note: 'Same witness discipline that caught every defect this session: exercise the fixed /api/distinct on data that EXCEEDS the cap and data under it. Over: ?field=event&limit=3 must report total 56, returned 3, truncated true. Under: ?field=event&limit=9999 must report total 56, returned 56, truncated false -- never a bare truncation flag on a complete list. Also exercise a field with FEWER distinct values than the default limit (e.g. field=sub, measured at 4 groups) to confirm the common case reports truncated false. Witness by requesting the live route and reading its JSON, never by reading the handler.'
  status: completed
  witness: 'Exercised the fixed route against the live server rather than reading the handler, over and under the cap and at a field that cannot reach it. Over: ?field=event&limit=3 returns total 56, returned 3, truncated true. Under: ?field=event&limit=9999 returns total 56, returned 56, truncated false -- a complete list never carries a truncation flag. Default: ?field=event returns total 56, returned 50, truncated true, which is the real-world case that was silently dropping 6 values. Small field: ?field=sub has only 2 distinct values against the default limit of 50 and reports truncated false, confirming the common case is not falsely flagged. All four measured in one pass on a freshly booted server after the edit.'
  commit_comment: Witness the distinct cap over, under, and at the default
- id: search-route-capped-without-signal
  note: 'Found by the route audit rather than by any planned row, and fixed the same turn: /api/search returned a bare {q, results} while capping, measured returning exactly 2000 results on ?q=dispatch&limit=99999 so a capped result was indistinguishable from an exhaustive one. Its scan breaks at limit instead of counting on, so a true match total would cost a second full pass over every event -- reporting truncated/scanned_all is the honest signal instead of an invented total. Now returns {q, results, returned, truncated, scanned_all}; witnessed at limit=5 giving {returned:5, truncated:true, scanned_all:false} and on a no-match term giving {returned:0, truncated:false, scanned_all:true}. Route doc entry updated from ''{q, results}'' to the full shape with the reason. Recorded as a row so the discovery is durable rather than living only in a response body.'
  status: completed
  witness: 'Fixed in the same turn it was discovered. src/server.js search() now returns {results, returned, truncated, scanned_all} and the route spreads it, replacing the bare array that made a capped result look exhaustive. Deliberately did NOT invent a total: the loop breaks at limit rather than scanning on, so a true match count would require a second full pass over every event, and reporting truncated/scanned_all tells the caller what it actually needs -- whether the list was cut. Witnessed against the live server: ?q=dispatch&limit=5 returns {returned:5, truncated:true, scanned_all:false}; ?q=zzz-no-such-term&limit=100 returns {returned:0, truncated:false, scanned_all:true}, so an exhaustive scan is never falsely flagged. Checked the one consumer before changing the shape -- test.js:41 asserts Array.isArray(search.results), which still holds since results remained an array -- and node test.js exits 0 (11517 events). ROUTES doc entry updated with the reason the total is absent.'
  commit_comment: Signal truncation on /api/search without inventing a total it cannot compute
- id: watcher-stopped-serving-gmsniff-blocking-commit
  note: 'STUCK STATE, recorded rather than blind-retried. The shared agentplug daemon accepts `bun x gm-plugkit@latest spool` and prints ''registered C:\dev\gmsniff'' but never refreshes this project''s .gm/exec-spool/.status.json -- heartbeat measured 11042s then 11096s then 11232s stale across three boots, i.e. frozen for over 3 hours while wall-clock advanced. in/git_finalize/9860.txt has been queued that whole time and no out/ file appears. This is NOT the reboot-loop convergence case: .watcher.log shows no codeinsight_rebuild/deferred_files lines, its last entries are a 44796ms transition dispatch and repeated ''exec rc=5 msg=database is locked'' rssearch failures from concurrent agents (spoint and gm are both live on the same store). An earlier identical wedge DID clear on its own after ~48s, so the daemon recovers unpredictably. Tried: three boots, bounded condition-waits on both the queue file and the heartbeat. The work itself is DONE and witnessed -- 5 PRD rows completed, node test.js exit 0 at 11594 events -- only the commit is blocked. Recovery is to re-dispatch git_finalize once the heartbeat advances, or fall back to the git verbs individually; do not re-dispatch while the file is still queued or the same commit lands twice.'
  status: pending
