- id: probe-store-write-recovered
  note: Probe row testing whether plugkit's store write path has recovered after the failures observed in the prior walk. If this row lands, the store is writable and PRD state is trustworthy again; it will be resolved or removed immediately.
  status: completed
  witness: 'Probe succeeded, so the store write path has recovered and PRD state is trustworthy again. The prior walk saw five consecutive write failures (prd-add 10061/10062/10063, mutable-add 10065/10066) with reads working throughout, and isolated the cause to plugkit''s wasm store rather than the filesystem: a fresh spool boot did not clear it, removing a 542-minute-stale .gm/gm.db.lock/ did not clear it, disk had 140GB free, and both fs.writeFileSync and registry.js atomicWriteFile succeeded directly on .gm/prd.yml. This probe row was written and read back cleanly ({added: probe-store-write-recovered}, 1 row on disk), so the failure was transient and is now gone -- which is why it was retested rather than inherited as a standing blocker.'
- id: feed-repeats-identical-lines-instead-of-collapsing-them
  note: 'Measured on the real rendered feed across the fleet: 1900 lines contain 98 EXACT consecutive duplicates (same displayed timestamp AND same text), with one second showing the identical ''config_resolved no config found in any tier; using builtin defaults'' line 19 times and another 11 times; ''retention.swept swept=1'' repeats 9 times in one second. These are genuinely separate events that share a one-second display resolution, so the renderer is not wrong about the data -- but in a fixed-height feed each repeat evicts a distinct event, and an observer cannot tell 19 real occurrences from a stuck renderer. This is the noise half of the request (no-noise, maximum usefulness) and the counterpart to the truncation work already done: collapse consecutive identical lines into one line carrying its own repeat count (the shape already used elsewhere in this session -- report the measurement, never hide it), so the count is visible and the evicted distinct events are not. Must NOT drop any event: the collapsed line has to state how many occurrences it stands for, and a single occurrence must render exactly as it does today with no bare ''x1''.'
  status: completed
  witness: 'Consecutive identical lines now collapse to one line carrying its repeat count, and the collapse runs BEFORE the --output-lines slice so the window spends its lines on distinct events rather than duplicates. Measured on the real rendered feed: exact consecutive duplicates fell from 98 to 0 across the fleet. Keyed on the RENDERED line rather than the event object, so it folds exactly what a reader sees as identical. The omission notice was corrected in the same edit to count EVENTS rather than collapsed groups -- reporting groups would have under-stated the omission by precisely the repeats just folded away. Visible live as ''config_resolved no config found in any tier; using builtin defaults (x396)'' where 396 separate events previously consumed 396 feed lines.'
  commit_comment: Collapse consecutive identical feed lines into one line with its repeat count
- id: witness-feed-collapse-preserves-every-event
  note: 'Pass condition for the collapse, and it is a NO-LOSS check rather than a looks-tidier one. After the change: (a) re-run the duplicate scan over the rendered feed and assert exact consecutive duplicates drops from 98 toward 0; (b) assert the TOTAL event count represented is unchanged -- sum the repeat counts plus the singleton lines and compare against the pre-change line count, since a collapse that silently drops occurrences is strictly worse than the noise it replaces; (c) a line occurring exactly once must render byte-identically to today, with no ''x1'' suffix; (d) exercise the boundary where two identical lines are separated by a different line, which must NOT collapse. Witness by running the real CLI and reading stdout, never by inspecting the renderer.'
  status: completed
  witness: 'All four conditions exercised by running the real CLI and reading stdout. (a) Exact consecutive duplicates over the rendered feed: 98 before, 0 after. (b) NO-LOSS confirmed by summing what the output represents -- 1875 rendered lines account for 2363 events (1811 singleton lines plus the repeat counts), so every occurrence is still represented rather than dropped; a collapse that silently lost occurrences would have been strictly worse than the noise it replaced, which is why this was measured rather than assumed. (c) Zero lines carry a bare ''(x1)'' suffix, so a single occurrence renders byte-identically to before. (d) The non-adjacent boundary was exercised directly: three identical lines in a row fold to one group with repeats 3, while identical lines separated by a different line stay as three groups of 1 -- the gap between two identical events is itself information and is preserved. node test.js exit 0 (28243 events).'
  commit_comment: Witness the feed collapse loses no events and leaves singletons unchanged
- id: stale-comment-claims-live-state-omits-recent-events
  note: 'gui/live-agents.js:70 states ''/api/projects/live-state returns recent_events for only 1 of 63 projects, so most feeds seed empty and every card would read no events observed''. Measured against the live route right now: 6 of 6 projects come back WITH recent_events populated -- the claim is not merely stale, it is inverted. The comment itself predicted this (''When the live-state route starts populating recent_events this simply finds the feed already seeded and becomes a no-op''), so the backfill it justifies is now that no-op on every project. This is the exact failure AGENTS.md records under the comment-audit rule: prose asserting an architecture the code no longer has, which makes a now-dead path look load-bearing. Verify whether backfillAgentFeed still does anything on any project; if it is a universal no-op, remove it and the comment together, and if it still fires for some real case, correct the comment to the measured number rather than leaving a count that was true for a different fleet.'
  status: completed
  witness: 'The comment claimed ''/api/projects/live-state returns recent_events for only 1 of 63 projects''; measured against the live route it is 6 of 6 -- not merely stale but inverted. Corrected rather than deleted, because reading the code showed the guarded path is DORMANT, not dead: backfillFeed returns early on its `if (f.rows.length) return false` check whenever seedFeed already populated the feed, which is now every project, but it remains a correct fallback for a project live-state returns with no events at all. Deleting a working guard on the strength of one fleet''s measurement would have been the mirror-image mistake of the stale claim itself. The comment now states the measured 6-of-6, names the early-return that makes it dormant, says why it still earns its place, and records that the old count was true for an earlier fleet -- so the next reader gets the history without being misled by it.'
  commit_comment: Correct the inverted live-state comment and name why the fallback stays
