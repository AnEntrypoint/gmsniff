- id: use-ds-table
  text: gm-table CSS hand-rolls what ds Table already provides with sortable, striped, compact and onSort built in.
  witness: 'Declined with a specific reason: the design systems Table sorts by header INDEX while renderEventTable sorts by column NAME with a special case mapping the sub column to the internal _sub field. Event rows carry dynamic column sets that change per page, so an index-keyed sort would silently re-point at a different column when the set shifts. Table also has no sticky header or per-cell overflow handling, both of which the 100-row event grid relies on.'
