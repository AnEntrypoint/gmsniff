- id: multi-agent-per-project
  text: Everything is keyed by cwd so two agents running in one project collapse into one row.
  witness: 'SETTLED WITH EVIDENCE rather than faked or left open. Replayed all 70 non-empty watcher logs on this machine and tested whether any _run epoch is ever revisited after a different epoch appears -- the signature of true concurrency. Zero of 70. Sixty-one projects carry multiple spawn epochs but every one is strictly sequential: restarts, not concurrent agents. Live /api/projects/live-state confirms 161 discovered, 5 shown, 0 rows carrying an agents array. expandAgents already handles the shape correctly; for it to be witnessable the server would have to emit per-row agents entries each carrying their own run_epoch plus per-agent phase, activity and recent_events -- and gm would first have to run concurrent daemon epochs per cwd, which it does not.'
  status: completed
  commit_comment: 'Settle multi-agent-per-project: gm does not currently run concurrent agents per cwd'
- id: panel-state-registry
  text: Every panel keeps module-level mutable globals in panels.js (20+ separate state objects), making panels un-instantiable singletons. Introduce a per-panel state registry.
  witness: 'DECLINED with a concrete path to make it safe, reached independently by two agents. The 20-plus module-level globals in gui/panels.js span 17 panels and are entangled with SSE dispatch and liveState, so a DOM-content diff cannot distinguish state correctly re-initialized from state silently shared -- there is no witness that would prove a pure refactor safe, and this repo does not accept unwitnessed refactors. What unblocks it is now known: this session proved gui/ pure modules ARE importable in Node once their ds/ edges are made lazy, as done for shared.js. Give panels.js the same treatment, pin each panels state-init with an assertion, and the refactor becomes provably behavior-preserving.'
  status: completed
  commit_comment: Decline the panel-state refactor and record what would make it provable
- id: gui-has-no-test-coverage-asymmetry
  text: 'test.js pins /api/project-signals against ever attaching a severity, but NO test covers the GUI side -- and that asymmetry is exactly how a ten-term attention score and a row-dropping filter survived client-side while the server was locked down. The server is guarded by assertions; the client is guarded only by whoever happens to look. Closing it needs a DOM, which the zero-dependency no-test-framework constraint makes non-trivial, so the design question is real: either assert against the served module exports without a DOM, or accept that the browser witness is the only client guard and make that explicit rather than implicit.'
  witness: 'CLOSED. The asymmetry was structural, not neglect: gui/shared.js could not load in Node at all because it imported data.js which imports the bare ds/ specifier, a browser-importmap alias Node cannot resolve. Making that one import lazy inside loadCapabilities -- the only function that fetches -- makes all 23 exports reachable from the suite with browser behavior unchanged. Root test.js now carries roughly 60 assertions over the clients pure functions, 26 of them direct calls, and TWELVE were falsification-tested: each reverted the real behavior, confirmed the exact expected failure message, then restored byte-identically. Two guards matter most -- assertions reject verdict words in attention reasons, and the null-comparator test pins staleSeconds null sorting as MOST silent. The agent also removed an assertion of its own that sat behind a try/catch import guard and silently skipped: a dead assertion reporting green is worse than none.'
  status: completed
  commit_comment: Close the client test gap that let a row-dropping filter survive server-side lockdown
