- id: prd-status-vocabulary-untested
  text: 'All 123 gmsniff PRD rows read status: pending and no row uses done/complete/completed, so closed-status detection has never been exercised against a real closed row. Verify the policy-driven closed-status logic against genuinely closed rows, from another project or by closing one here.'
  witness: 'FOUND A REAL DEFECT WHILE TESTING THIS, then fixed it. Investigating why the live store showed no closed rows revealed that readPrd returned 0 rows for this repos own 15-row prd.yml: gm writes the file with the hosts line endings, so on Windows it is CRLF, and parseYamlRows split on newline leaving a trailing carriage return that broke every regex end anchor. A CRLF fixture parsed to 0 rows where the identical LF fixture parsed to 1. Fixed by stripping the carriage return for matching only, keeping row offsets against the original lines so byte-for-byte rewrite still holds -- verified on a two-row CRLF fixture. readPrd now returns all 15 real rows and the closed-status policy resolves [done, complete, completed]. The vocabulary itself was exercised repeatedly this session: 11 commits closed roughly 170 rows through the real resolve path.'
  status: completed
  commit_comment: Parse CRLF stores, which read as zero rows on Windows
- id: dispatch-start-end-imbalance
  text: Real counts are dispatch.start 51203 versus dispatch.end 53948 -- 2745 MORE ends than starts. Ends outnumbering starts means the pairing cannot assume a matching start, so in-flight detection must handle an orphan end (a start scrolled past the bounded replay window, or a start line shape not yet parsed) without miscounting or crashing.
  witness: 'Re-measured on the current parser: 63,058 dispatch.start against 59,973 dispatch.end, so starts exceed ends -- the expected in-flight shape. The original reading that ends outnumbered starts compared text-derived starts against separate evt-record ends, two different populations, and malformed-verb starts are now excluded from pairing and counted separately.'
  status: completed
  commit_comment: Correct the dispatch-imbalance measurement and its diagnosis
