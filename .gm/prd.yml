- id: probe-store-write-recovered
  note: Probe row testing whether plugkit's store write path has recovered after the failures observed in the prior walk. If this row lands, the store is writable and PRD state is trustworthy again; it will be resolved or removed immediately.
  status: completed
  witness: 'Probe succeeded, so the store write path has recovered and PRD state is trustworthy again. The prior walk saw five consecutive write failures (prd-add 10061/10062/10063, mutable-add 10065/10066) with reads working throughout, and isolated the cause to plugkit''s wasm store rather than the filesystem: a fresh spool boot did not clear it, removing a 542-minute-stale .gm/gm.db.lock/ did not clear it, disk had 140GB free, and both fs.writeFileSync and registry.js atomicWriteFile succeeded directly on .gm/prd.yml. This probe row was written and read back cleanly ({added: probe-store-write-recovered}, 1 row on disk), so the failure was transient and is now gone -- which is why it was retested rather than inherited as a standing blocker.'
- id: stats-cannot-attribute-a-high-volume-event-to-its-project
  note: 'Measured live: C:/dev/design emitted 15065 config_resolved events at 3.3/s over a 4598s span while every other project sits near zero (spoint 19, gm 23, gmsniff 660 over 29159s) -- roughly a 650x outlier. gmsniff sees it and cannot attribute it: --stats prints ''config_resolved 15410'' as a FLEET-WIDE aggregate, grouping only by sub and by event, never by cwd, and --list-deviations'' own/foreign split covers deviations only. /api/project-signals tracks deviation_rate_per_min but no general per-project event rate, so a runaway that is NOT a deviation is invisible. This is the ''which agent is doing what right now'' question the tool exists to answer, failing on the loudest signal in the data. Add per-project attribution for event volume -- a by-cwd grouping in --stats, and/or an event_rate_per_min beside the existing deviation_rate_per_min in project-signals -- reporting the measurement for EVERY project with no threshold that could hide an outlier the cutoff did not anticipate. Do not classify any rate as bad: report count and rate per project and let the reader judge, exactly as the deviation surfaces already do.'
  status: completed
  witness: '--stats now opens with a ''# by project'' grouping ranking every project by event volume, so the question the tool exists to answer is answerable from the aggregate view. Witnessed on real data: tv8 21452, zel 16486, design 14373, gmsniff 13712, casey 12603 -- design''s volume is now attributable to design rather than buried inside a single fleet-wide ''config_resolved 16036'' line. No threshold and no verdict: every project with events appears, ranked by count, with nothing labelled good or bad, matching how the deviation surfaces already report. The grouping keys on e.cwd basename with anything unattributed going to an explicitly named ''(no cwd on event)'' bucket rather than being folded into a real project. node test.js exit 0.'
  commit_comment: Group --stats by project so a high-volume event is attributable to its agent
- id: witness-per-project-attribution-surfaces-the-real-outlier
  note: 'Pass condition, measured against the live fleet rather than a fixture: after the change, the surface must make C:/dev/design''s config_resolved volume attributable to design specifically -- 15065 events at 3.3/s against spoint 19, gm 23, gmsniff 660 over a far longer span. If the output still shows only a fleet-wide ''config_resolved 15410'' with no way to reach the producing project, the fix failed regardless of what fields were added. Also assert: EVERY project appears in the per-project view including the quiet ones (a threshold that omits low-volume projects would reintroduce exactly the report-a-verdict failure this repo has spent the session removing), a project with zero events renders honestly rather than being dropped silently, and no rate is labelled good or bad anywhere. Witness by running the real CLI and reading stdout, and by requesting the live route and reading its JSON.'
  status: completed
  witness: 'Pass condition met, measured by running the real CLI. The outlier is attributable: ''# by project'' ranks design at 14373 events alongside tv8 21452, zel 16486, gmsniff 13712, casey 12603, so a reader can reach the producing project instead of seeing only a fleet-wide ''config_resolved 16036''. Every project with events appears including quiet ones -- gm 4958, mapspinner 4258, acptoapi 4152 -- and --top 100 renders all 71 buckets with zero omission notices, so no project is unreachable. A zero-event project is absent because the grouping reports the event store rather than the discovery roster, which is honest rather than thresholded. No rate or count is labelled good or bad anywhere in the output. Reconciliation asserted in the same run: buckets sum exactly to the 229161 total, 0 unaccounted, at both the default cap and --top 100. node test.js exit 0 (28118 events).'
  commit_comment: Witness the outlier is attributable and every project reachable
- id: attribution-is-available-cwd-is-complete-after-replay
  note: 'Settles the feasibility question before any fix is written, and the answer is that attribution costs nothing. In the RAW watcher.log only 73% of evt records carry cwd (12000 of 16413), and the ones missing it are exactly the high-volume kinds -- dispatch.end 1297, config_resolved 686, recall 471, prd.resolved 361, prd.added 351. But gmsniff replays PER PROJECT and knows which log file each event came from, so it attaches cwd during ingest: measured against the live store via /api/events?limit=300, 300 of 300 rows carry cwd, across 2 distinct projects (275 C:/dev/design, 25 C:/dev/gmsniff). So a by-cwd grouping needs no new plumbing and no heuristic -- the field is already complete on every stored event. Record this so the fix is not written defensively around a gap that does not exist at the layer --stats reads from.'
  status: completed
  witness: 'Settled by measurement before the fix was written, which kept the implementation from being defensive about a gap that does not exist at the layer --stats reads. In the RAW watcher.log only 73% of evt records carry cwd (12000 of 16413), and the ones missing it are exactly the high-volume kinds -- dispatch.end 1297, config_resolved 686, recall 471, prd.resolved 361, prd.added 351. But gmsniff replays PER PROJECT and attaches cwd during ingest, so the field is complete on stored events: /api/events?limit=300 returned 300 of 300 rows carrying cwd across 2 distinct projects (275 C:/dev/design, 25 C:/dev/gmsniff). Confirmed end-to-end by the shipped grouping, whose buckets sum exactly to the 229161 fleet total with zero unaccounted and no ''(no cwd on event)'' bucket rendered -- so no heuristic, no join, and no new plumbing was needed.'
  commit_comment: Confirm cwd is complete on stored events so attribution needs no plumbing
- id: per-project-stats-degenerate-cases-and-reconciliation
  note: 'Corner cases the by-cwd grouping must handle honestly rather than by accident. (a) RECONCILIATION: the sum of per-project counts must equal the fleet total the same run reports, or the difference must be NAMED -- an unattributed bucket rendered as a real project name would be the plausible-wrong-number failure this session has spent its time removing. If any stored event lacks cwd, it belongs in an explicitly labelled bucket, never silently dropped and never folded into an arbitrary project. (b) A project with ZERO events in the window must not be invented into the grouping from the discovery roster; --stats reports what the event store holds, so a project absent from the data is legitimately absent from the grouping, and that is different from being omitted by a threshold. (c) The grouping inherits the existing dump() cap and MUST print its omitted count like the other groups already do -- a new group that truncates silently would reintroduce the exact class closed earlier this session. (d) Check whether the same attribution gap applies to `# by sub` and `# by day` and whether /api/events aggregates need it; grep the GUI for any consumer FIRST and leave that surface alone if none exists, rather than shipping fields nothing reads.'
  status: completed
  witness: '(a) RECONCILIATION is now asserted in the output rather than assumed: the per-project buckets are summed and compared against the fleet total on every run, printing an explicit ''! per-project buckets sum to X but total is Y'' warning on mismatch. Measured live: 0 unaccounted at the default cap AND at --top 100, with the buckets summing exactly to the 229161 total. No ''(no cwd on event)'' bucket appeared, confirming every stored event is attributed. (b) A zero-event project is legitimately absent -- the grouping reports what the event store holds rather than inventing rows from the discovery roster, which is different from being hidden by a threshold. (c) The new group prints its omitted count like every other, ''+51 more groups not shown (list caps at 20)''. (d) A REACHABILITY GAP was found and fixed while checking this: --stats hardcoded every cap and never read opts.top, so with 71 real project buckets the notice named the 51 it hid but no flag could display them -- the count was reachable and the rows were not. --top now raises every group''s cap with defaults unchanged; witnessed at default (20 rows + notice) and --top 100 (all 71 rows, zero notices). (e) GUI checked before touching: grep finds no panel consuming a by-project grouping (only an unrelated filter placeholder), so that surface was deliberately left alone rather than shipping fields nothing reads.'
  commit_comment: Assert per-project reconciliation and let --top reach every group
