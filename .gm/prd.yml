- id: verify-likely-orphaned-hint-is-not-actionable
  note: 'instruction''s codeinsight_overview reported apiPost (gui/data.js:36) and fmtTs (gui/data.js:14) as likely_orphaned. Witnessed by exec_js across all 15 gui/src js files: apiPost has 7 real call sites (live-agents.js:224, panels.js:626/722/770/811 plus 2 imports) and fmtTs has 10. The hint is a false positive caused by a partial index (digest files=4:partial=57) that never read the importing modules. Confirm no dead-code removal is warranted and that no surface acts on this hint.'
  status: completed
  witness: 'Confirmed non-actionable by execution. (1) Call-site census via exec_js-9131 across all 15 gui/src js files: apiPost has 7 real references (definition gui/data.js:34, imports live-agents.js:6 and panels.js:5, calls live-agents.js:224 and panels.js:626/722/770/811) and fmtTs has 10 (definition gui/data.js:12, 2 imports, live call sites live-agents.js:263 and panels.js:166/252/378/507/541/561). Neither is orphaned. (2) The hint is a partial-index artifact: instruction''s codeinsight_overview reported digest v3:747a29ab0d21d498:files=4:partial=57 over only 6 files, none of which were the importing modules. (3) Scanned src/index.js, src/server.js, src/cli.js, gui/app.js, gui/panels.js, gui/live-agents.js for ''likely_orphaned'' or ''codeinsight_overview'' -- zero matches, so no gmsniff surface consumes the hint and no behavior depends on it. (4) node test.js exit 0: ''gmsniff OK - 9670 events across 5 days - live-feedback verified - multi-project fanout verified - formal-spec verified - stuck-state+throughput+memory-health+codeinsight-age verified - total-parser verified - watcher-log-total-parse+source-priority+correlation+project-state verified''. No dead-code removal warranted.'
  commit_comment: Confirm likely_orphaned hint is a partial-index false positive with no consumer
- id: reexamine-panel-state-registry
  note: 'Previously declined: consolidating ~20 module-level GUI state globals into a single registry was rejected because no witness could prove the refactor safe. Re-examine now that the browser verb path is being retested: either produce a real witness (enumerate every global, prove each read/write path via executed DOM inspection) and do the refactor, or record the concrete missing capability that still blocks it.'
  status: completed
  witness: 'Re-examined with the witness that was missing when this was first declined, and the refactor is REJECTED ON MEASURED GROUNDS rather than deferred. Enumeration via exec_js-9166 across all 7 gui modules found 25 module-level state declarations, not an undifferentiated ~20-global soup: gui/panels.js 14, gui/app.js 9, gui/live-agents.js 1 (drilldownAux), gui/shared.js 1 (caps), and ZERO in gui/data.js, gui/honest-state.js and gui/markdown.js. The majority are already encapsulated per-panel objects owned by exactly one panel -- codesearchState, consoleState, treeUiState, graphUiState, sessionDetailState, deviationsFilterState, evTypesDaysCache, codeInsightUi, errorByRowIdAndField. Only 9 are bare let/var bindings and each is genuinely module-private machinery (renderQueued/renderWantsFetch render coalescing, sse/reconnectDelay transport, pulseTimer, liveEntries autoscroll set). Hoisting these into one registry would convert panel-private state into globally-reachable state, widening the single-writer surface AGENTS.md protects, for no measured benefit -- the current shape already satisfies the property the registry was meant to provide. Live GUI witnessed working with this state layout via browser-9167 against http://127.0.0.1:7799/#panel=agents: exit_code 0, 35 nav controls, live manager view rendering ''5 working agents, longest-silent first'' with gmsniff RUNNING/EXECUTE/''4m 18s - prd 4/4 - mut 0''/''last event 15s ago'' and spoint RUNNING/EMIT/''prd 313/837'', each row naming its measurement and age, ''5 shown / 5 reported by live-state'' stating its own completeness, and idle agents folded but counted (RUNNING 2 / IDLE 3). node test.js exit 0 in the same session.'
  commit_comment: Reject panel-state registry on a measured enumeration of 25 already-encapsulated state declarations
- id: reexamine-multi-agent-per-project
  note: 'Previously declined on measurement: all 70 watcher logs showed zero revisited run epochs, so gm was judged not to run concurrent agents per cwd. Re-measure against current watcher-log data -- if any cwd now shows overlapping run epochs the per-project single-agent assumption in the live-agents view is wrong and must be widened; if not, record the fresh measurement.'
  status: completed
  witness: 'Re-measured against real current watcher-log data and the prior conclusion is RESTATED ON CORRECTED GROUNDS. First probe (exec_js-9161) scanned 3 registry cwds / 141710 lines for a "run" field and reported runs:0, projects_with_interleaved_runs:0 -- that number was NOT evidence of no concurrency, it was a regex matching nothing, so it was discarded rather than reported. Second probe (exec_js-9162) enumerated the actual evt key universe over the last 400 evt records of C:/dev/spoint (83386 lines, 12282 evt lines): the 40 keys present are deferred/detail/embed_failed/embedded/error/event/files_removed/files_written/from/hit/id/key/kind/kv_hits/mode/ms/mutables_pending_count/n_hits/namespace/note/phase/prd_pending_count/query/query_len/reason/rekeyed/removals_skipped_unverified/repo/rescoped/sha/skipped/source/sub/summary/tier/top_score/ts/upserted/vec_err/verb/version/why/window -- there is NO run and NO sess field on any of them. All 1355 lines matching ''run'' were the literal banner ''[plugkit-wasm] spool watcher running''. Conclusion: per-project agent concurrency is structurally unmeasurable from the watcher log because its events carry no per-agent identity, which is exactly why src/correlation.js ranks down to a bare cwd key. The live-agents view''s one-row-per-cwd shape is therefore correct for this data source, and widening it would require an identity the telemetry does not emit.'
  commit_comment: 'Re-measure per-project concurrency: watcher-log events carry no run/sess identity'
- id: witness-browser-verb-availability
  note: A prior mutable recorded blockedBy:external because 8+ browser verb dispatches failed (page unbound, session close/reset throwing SyntaxError), forcing curl+node --check substitutes for every client-side change. Re-test the browser verb against the real GUI this session using the documented prefix body shape. If it works, the external marking is stale and client-edit witnessing must go through it; if it still fails, capture the exact failure.
  status: completed
  witness: 'Browser verb witnessed WORKING against the live GUI on http://127.0.0.1:7799/. Dispatch browser-9151 with body ''url=<target>'' + direct DOM statements returned exit_code:0, result {title:''gmsniff'', bodyLen:37507, hasShell:true}, stderr empty. The prior blockedBy:external diagnosis was wrong in its cause: the verb is not broken, it evaluates the body in the PAGE context (stderr of browser-9150 names it ''cdp-eval''), so any body referencing Playwright''s `page` object fails with ReferenceError: page is not defined, while the same body written as browser-context code (bare document/window access) succeeds. Both halves witnessed this turn: 9150 with page.evaluate failed, 9151 with direct document access succeeded against the identical URL.'
  commit_comment: Witness browser verb works via page-context eval, not page.evaluate
