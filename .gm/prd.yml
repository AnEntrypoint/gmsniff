- id: sync-drift-recurs-thrice
  title: Record that upstream drift recurred three times in one session
  body: sync:ds:check went clean-to-drifted three separate times this session (colors_and_type/table.js/kits-appended, then json-viewer, now these three sheets), because ../design is under active concurrent development. The operational conclusion is that a green drift check has a short shelf life and must be re-run rather than remembered.
  SESSION_ID: gmsniff-sync-1785255207
  status: completed
  witness: 'Confirmed by count rather than impression: sync:ds:check went clean-to-drifted three separate times within this one session -- first colors_and_type.css/content/table.js/kits-appended.css, then json-viewer.js, now topbar.css/primitives.css/panel-row.css -- because ../design is under active concurrent development (its git status shows uncommitted work throughout and its HEAD moved to bb39848). The operational conclusion, already acted on twice: a green drift check has a short shelf life, so gm-continue re-runs it as part of its verification pass rather than trusting an earlier green, which is exactly how each of these three was caught.'
  commit_comment: Record that upstream drift recurred three times this session
