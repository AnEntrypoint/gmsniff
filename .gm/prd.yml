  status: completed
  witness: 'sync-ds reports import closure adds 60 file(s) beyond the seed list on every run, and the app mounts: root children 1, all 8 panels rendering 262-25421 chars, zero page errors. This is the check that catches the partial-vendor failure seen earlier this session, where shell.js was vendored without its shell/ subdirectory and the page rendered an EMPTY div#root with readyState complete and nothing in the server log.'
  commit_comment: Confirm the import closure resolves after the sync
- id: ds-table-a11y-adoption
  title: Check whether the upstream Table scrollable-region fix reaches gmsniff surfaces
  body: Upstream added tabindex=0 + role=group + aria-label to the ds Table wrapper for WCAG 2.1.1 / axe scrollable-region-focusable. gmsniff renders its own .gm-table markup rather than the ds Table component, so the fix may not apply here -- determine by execution whether any gmsniff scroll container is keyboard-unreachable, and if so apply the same shape.
  SESSION_ID: gmsniff-gui-impeccable-1785231986
  status: completed
  witness: 'The upstream Table fix does not reach gmsniff (it renders its own .gm-table markup), but scanning for the SAME defect class found two real instances: .ds-ep-json viewers scrolling 761px of content inside 250px with no focusable descendant -- WCAG 2.1.1, axe scrollable-region-focusable. Fixed upstream in ../design json-viewer.js and synced. A first attempt gated the fix on the maxHeight prop and was WRONG: .ds-ep-json carries max-height:300px;overflow-y:auto in editor-primitives.css, so a prop-less viewer still scrolls -- measured live at scrollHeight 1265 against clientHeight 300 while sitting at tabindex -1. Made unconditional and re-witnessed: both the prop and no-prop viewers report tabindex 0, role group, aria-label JSON scrollable, while the empty state correctly stays tabindex -1 with no role. Panel scan re-run: unreachable scrollers 2 -> 0.'
  commit_comment: Make every JSON viewer keyboard-reachable
