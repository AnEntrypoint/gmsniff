- id: agent-card-shows-prose-heading-as-phase
  note: 'Witnessed in the live GUI live-agents panel: each card renders TWO phase-ish values and one of them is scraped next-step.md prose, not the authoritative phase. casey renders ''PLAN'' beside ''COMPLETE'' while .gm/turn-state.json says phase=COMPLETE and next-step.md''s heading is ''# PLAN''; looper renders ''UPDATE-DOCS'' beside ''COMPLETE'' -- UPDATE-DOCS is a SKILL name and not a phase at all; aloop renders ''EXECUTE/EXECUTE''. AGENTS.md states turn-state.json is the primary phase source and prose scraping is the fallback, so displaying the scraped heading next to the real phase presents a stale/wrong value as though it were data. Decide what that first slot is actually for (served-prose section, or last_skill) and label it truthfully, or remove it.'
  status: completed
  witness: 'The card mapped instruction_heading into the ds SessionCard''s `model` slot, which renders as a bare unlabelled word directly beside the authoritative phase -- so ''PLAN'' next to ''COMPLETE'' read as two contradictory phases when it was actually served-prose provenance beside authoritative FSM state. The divergence is REAL and worth surfacing, not hiding: verified by executing readLivePhaseState across six live projects, casey served PLAN while turn-state.json said COMPLETE, and gmsniff served PLAN while its phase was EXECUTE. Added servedSectionLabel, which renders ''serving <SECTION>'' and appends ''(phase moved on)'' when the existing shared.js phaseDivergence helper reports a mismatch -- reusing that helper rather than writing a parallel one. Witnessed in the real browser (browser-9382): cards read ''serving PLAN'' above phase ''EXECUTE'' for gm, ''serving EMIT'' above ''EMIT'' for spoint -- the slot now names what it is, and the lag is legible instead of contradictory. node test.js exit 0.'
  commit_comment: Label the served-instruction slot so it stops reading as a second phase
- id: working-agents-banner-contradicts-running-idle-split
  note: 'The live-agents panel header says ''6 working agents, longest-silent first'' and immediately below the same page renders ''RUNNING - 2'' and ''IDLE - 4''. Two counts of the same set, disagreeing, on one screen: the banner calls four idle agents ''working''. Witnessed live with 6 rows where only gmsniff and spoint were dispatching. Make the banner state the same fact the cards do -- count running separately from idle, or rename the banner to what it actually counts (discovered/reported), never a bare ''working'' that the rows below contradict.'
  status: completed
  witness: 'The banner counted workingCwds.size -- every live-state row including idle ones -- and called the total ''working agents'', while the cards below split the identical set into RUNNING and IDLE. healthScopedToWorkingAgents now also returns `dispatching` (rows where watcherAlive is true) and the banner renders the same split the cards do. Witnessed in the real browser after a cache-defeating reload (browser-9340): banner line reads ''3 dispatching - 3 idle, longest-silent first'', matching the three dispatching rows (gmsniff, spoint, gm) and three idle rows (looper, casey, aloop) listed immediately beneath it. Regex check /\d+ working agents/ against the rendered text returns false -- the contradicting phrasing is gone. Nothing was dropped from the list; only the label now names what it actually counts.'
  commit_comment: Make the health banner state the same running/idle split the cards show
- id: health-banner-reports-watcher-not-running-when-daemon-is-alive
  note: 'The live-agents health banner prints ''looper (watcher not running, silent 185m)'', ''casey (watcher not running, silent 167m)'', ''aloop (watcher not running...)'' and ''gm (watcher not running...)''. Measured directly: ALL six projects report .status.json pid 10648 with status_ts age between 23ms and 197ms -- one shared machine-wide daemon, alive and heartbeating for every one of them. The banner is deriving daemon liveness from watcher.log mtime (looper 186min, casey 168min, aloop 143min), which measures PROJECT idleness, not daemon liveness -- exactly the three-meanings-of-liveness substitution AGENTS.md names as the recurring bug. Report the project''s real silence duration without asserting a false claim about the daemon.'
  status: completed
  witness: 'Fixed at the label/source mismatch and witnessed in the real browser with a cache-defeating reload (browser-9340). Root cause read from source: src/server.js:1654 sets watcherAlive: liveness.alive, which is readProjectLiveness(cwd).active -- the per-project WORKING judgement -- while the same response already carries daemonPidAlive: liveness.daemon_alive, the actual machine-wide daemon field, which the banner ignored. gui/app.js healthMeasurements rendered the former as ''watcher running''/''watcher not running'', so every idle project asserted a dead daemon. Measured refutation: all six projects report .status.json pid 10648 with status_ts age 23-197ms, one shared agentplug daemon alive for all of them. Now renders the project''s own state (''dispatching''/''idle'') and surfaces a genuine daemon fault only when daemonPidAlive is explicitly false. Post-fix DOM read: says_watcher_not_running false, rows read ''looper (idle, silent 195m, 0.0 deviations/min)'' and ''gm (dispatching, silent 0m, 0.1 deviations/min)'' -- every measurement and its age preserved.'
  commit_comment: Report project idle/dispatching instead of falsely claiming the shared daemon is down
- id: instruction-column-shows-prose-heading-not-instruction
  note: Both the CLI --agents INSTRUCTION column and the GUI agent card render the literal word 'ORCHESTRATOR' as the served instruction, for every project. ORCHESTRATOR is the first markdown heading of next-step.md, not an instruction -- it is identical across all agents and therefore carries zero information in the column whose entire purpose is 'what instruction is this agent executing right now'. The real per-agent content is the phase-specific section below it (PLAN/EXECUTE/EMIT prose), which next_step_headings shows as the 2nd or 3rd heading. Extract and show the instruction that actually distinguishes one agent from another.
  status: completed
  witness: 'Root cause in src/registry.js readLivePhaseState: `body.match(/^#\s*(.+?)\s*$/m)` took the FIRST top-level heading, and gm concatenates a constant ORCHESTRATOR preamble ahead of the phase section, so every project on the machine reported the identical word in the column whose purpose is to distinguish agents. Now takes the LAST top-level heading. One intermediate attempt was caught and corrected by measurement rather than shipped: matching `^#\s*` also matches `##`, so the last heading became the `## Dispatch` subsection and all six projects reported ''DISPATCH'' -- one constant traded for another, and skill lookup broke to null. Tightened to `^#[ \t]+` (top-level only). Verified by executing readLivePhaseState against six real projects: headings now PLAN/EMIT/UPDATE-DOCS/EXECUTE (4 distinct across 6 projects) with skill resolving again. Witnessed in the real browser on a freshly-started server (browser-9382, the prior read still showed ORCHESTRATOR purely from the old process''s phase-state cache): five distinct ''serving X'' values render and no bare ORCHESTRATOR remains. node test.js exit 0.'
  commit_comment: Take the last top-level next-step heading so the instruction column distinguishes agents
- id: event-feed-renders-empty-details-and-mid-sentence-truncation
  note: 'Witnessed in the live CLI --agents output feed: (1) ''embed_init_fail'' renders with a completely EMPTY detail -- a bare event name and trailing whitespace, so the reader learns an init failed but nothing about what or why; (2) ''embed.slim-build-no-fallback this is a slim build (feature=slim): no wasm-embedded safetensors fallback exists, and the'' is cut mid-sentence at a hard character cap, losing the actual consequence clause; (3) 4 of spoint''s 7 feed lines are bare ''dispatch.end <verb>'' with no duration, which crowds out the substantive events (prd.added/prd.resolved) in a fixed-height feed. Fix all three: render a real detail or say plainly there is none, truncate on a word boundary with an explicit ellipsis, and stop letting low-information repeats displace high-information lines.'
  status: completed
  witness: 'All three sub-defects fixed and measured against the REAL rendered CLI output rather than against the log alone. (1) Empty details: 129 of 384 rendered feed lines were bare event names; now 6 (1.6%). Correcting my own earlier measurement -- the 5.3% figure from the evt-record scan MISSED this class entirely, because retention.swept (65), plugkit.version (33) and lock.stale-takeover (23) are synthesized by src/watcher-log.js from structured TEXT lines, not evt: JSON, so a coverage scan over evt records reported them as covered while they rendered blank. Added their real fields (version, swept, holder_pid, age_ms, parent_pid); they now render ''plugkit.version 0.1.832'' and ''retention.swept swept=2''. (2) Mid-sentence truncation: replaced the hard .slice(0,90) with truncateOnWordBoundary, which backs up to the last space when that keeps at least 60% of the budget and appends a real ellipsis. Measured over the same 384 lines: mid_word_cuts 0. (3) dispatch.end noise resolved on its own row by rendering the duration. The 6 remaining blanks were inspected and carry nothing operator-facing -- gemm_simd128_flag_check holds only {read_back,set_to} booleans, and update.available/instruction.handle-start carry no payload -- so a bare name there is truthful.'
  commit_comment: Fill empty event details and truncate on word boundaries
- id: event-detail-renderer-misses-the-error-field
  note: 'ROOT CAUSE of the empty ''embed_init_fail'' detail, measured against real watcher.log records: gm emits its explanatory text under DIFFERENT keys per event kind. embed_init_fail carries {error: ''slim build has no wasm-side embedding fallback -- host_vec_embed must be implemented by the host (e.g. agentplug-runner native candle path)''} while embed.slim-build-no-fallback carries {reason: ''...''}. Key frequency over the matched lines: error 3, reason 3, event 6, ts 6. The feed renderer surfaces one of these keys and not the other, so a fully-explanatory message is discarded and the operator sees a bare event name -- the same producer/consumer field-name mismatch class that previously made gates_failing empty for every project. Enumerate the detail-bearing keys that actually occur in real data and render whichever is present, rather than hardcoding one name.'
  status: completed
  witness: 'Root cause was src/cli.js fmtEventLine''s fallback chain `e.detail || e.reason || e.verb || e.phase || e.id || e.key || e.query` -- `error` was absent entirely, so embed_init_fail rendered its name and nothing else while its full text sat in that field. Rather than adding one guessed key, the real key universe was measured across 32919 evt records from four live projects: the old chain left 16565 lines (50.3%) with an EMPTY detail. Replaced with a measured EVENT_DETAIL_KEYS prose chain (detail, reason, error, summary, note, verb, phase, id, key, query, path, model, sha) plus an EVENT_DETAIL_NUMERIC_KEYS name=value fallback for records carrying only counts. Re-measured against the same 32920 records: blank details fell to 1734 (5.3%), recovering 14831 previously-nameless lines. Witnessed live in `node src/cli.js --agents`: ''embed.model-loaded BAAI/bge-small-en-v1.5'', ''embed_init_ok safetensors_bytes=133466304 host_delegated=false'', ''deviation.long-gap-no-instruction verb=fsm-validate gap_ms=547458129'', and git.commit now showing its real commit subject. The 5.3% still blank were inspected and are genuinely empty at the source -- deviation.consolidate-without-residual-scan and deviation.complete-without-ci-validation are emitted by gm with detail:'''' -- so a blank there is truthful rather than a dropped field.'
  commit_comment: Render event details from the measured key universe instead of a chain missing error
- id: projects-route-ships-163kb-to-render-two-rows
  note: 'Measured against the live server: /api/projects returns 163KB across 173 rows of which only 2 are alive (171 idle). Average row 962 bytes, and the per-row ''liveness'' sub-object is 657 of those bytes -- 68% of the payload -- shipped in full for every idle project the panel does not display. Comparable routes: /api/project-signals 71KB, /api/deviations 72KB, /api/watcher-versions 25KB. This is the single biggest presentation cost in the tool and it is paid on every poll. Reduce what crosses the wire for rows that are not rendered (summary row + on-demand liveness detail, or a scoped/paged shape) WITHOUT making any project unreachable -- report-measurements-never-a-verdict forbids dropping idle rows from the result set, so the fix is payload shape, never omission.'
  status: pending
- id: stuck-projects-route-is-live-but-unreferenced
  note: /api/stuck-projects still exists and serves 72KB on request, but grep across gui/app.js, gui/panels.js, gui/live-agents.js, gui/shared.js and gui/data.js finds ZERO references to it -- no panel fetches it. It is dead surface still carrying the name AGENTS.md records as the canonical report-a-measurement-never-a-verdict failure (it decided 15min was stale, 10 rows a backlog, and returned only projects scoring above zero). Confirm nothing else consumes it (CLI, --schema, external), then remove it, or if some consumer does exist, verify it no longer omits rows. Leaving a 72KB verdict-shaped route reachable invites a future panel to wire itself back to the exact shape the doctrine forbids.
  status: pending
- id: health-summary-ships-38kb-for-a-six-row-banner
  note: /api/health-summary returns 38.5KB and is fetched by gui/app.js to render the live-agents health banner, which displays six one-line rows (name, watcher state, silence duration, deviations/min). The banner needs roughly 6 x 60 bytes of the payload it receives. Same class as the /api/projects finding but on the route that renders FIRST and therefore gates time-to-first-meaningful-paint on the panel the whole tool leads with. Shrink what the banner route returns to what the banner shows, keeping every project reachable through the fuller routes.
  status: pending
- id: dispatch-end-noise-crowds-the-output-feed
  note: 'Measured in the live CLI feed: 4 of spoint''s 7 visible lines are bare ''dispatch.end <verb>'' carrying no duration and no outcome, and gmsniff''s feed spends 2 of 7 lines the same way. The feed is fixed-height, so every dispatch.end line evicts a substantive one (prd.added, prd.resolved, instruction.served, a real error). AGENTS.md notes dispatch.end is the ONLY evt carrying {ms, verb} and pairs with the synthesized dispatch.start -- so the duration exists in the record and is being dropped at render time, leaving the least informative possible version of the line. Either render it with its duration so it becomes useful, or rank it below substantive events so it never evicts one; state the count of anything hidden.'
  status: completed
  witness: 'Resolved by making the line informative rather than by suppressing or re-ranking it, which is the better fix for an observability tool: the row noted 4 of spoint''s 7 feed lines were bare ''dispatch.end <verb>'' with no duration, so they evicted substantive events while carrying nothing. Since 100% of dispatch.end records were measured to carry ms (median 560ms, max 339670ms), every one of those lines now renders its duration -- witnessed live as ''dispatch.end prd-add 425ms'' and ''dispatch.end instruction 8.2s''. A dispatch.end line now tells the reader which verb ran and how long it took, which for a stuck agent is the single most actionable fact available, so it no longer displaces information -- it carries it. No event was hidden, dropped or de-ranked, so nothing became unreachable and no slow/fast threshold was invented.'
  commit_comment: Make dispatch.end lines informative rather than suppressing them
- id: dispatch-duration-is-present-on-every-record-and-discarded
  note: 'Measured 400 real dispatch.end records from C:/dev/spoint: 100% carry a numeric ms field. Median 560ms, MAX 339670ms -- a 5.7-MINUTE dispatch that the feed rendered as a bare ''dispatch.end <verb>'' line with no indication anything was slow. The single most actionable number for ''what is this agent stuck on right now'' is present in every record and thrown away at render time. Surface the duration on the line, and make an outlier legible as a measurement (show the ms, sorted or highlighted by magnitude) without inventing a slow/fast verdict threshold. Verb frequency in the sample: prd-resolve 170, git_finalize 76, instruction 39, prd-add 37, memorize-fire 24, recall 17.'
  status: completed
  witness: 'dispatch.end now renders its duration. eventDetailText checks {ms, verb} before the prose chain, because `verb` alone previously won the fallback and produced a bare verb name while the ms field went unread. Added fmtDispatchMs rather than reusing fmtAge: fmtAge floors to whole seconds and would render the measured 560ms median as ''0s'', erasing the entire sub-second band most dispatches occupy. Witnessed live in `node src/cli.js --agents`: ''dispatch.end prd-add 425ms'' and ''dispatch.end instruction 8.2s'' -- previously both were bare ''dispatch.end <verb>''. The formatter was verified by EXECUTING the module, not node --check: an earlier draft referenced a non-existent fmtDurationMs, which parses clean and would have thrown only at runtime -- exactly the partial-rename trap AGENTS.md names. No threshold or slow/fast verdict was added; the measurement itself is now legible.'
  commit_comment: Show dispatch duration on every dispatch.end line with sub-second resolution
- id: cli-and-gui-disagree-on-the-same-facts
  note: 'Captured within seconds of each other from the same data: CLI --agents printed ''2 shown / 70 discovered'' while the GUI banner printed ''6 working agents'' and ''6 shown / 6 reported by live-state'', and the GUI listed gm/aloop/casey/looper as rows the CLI had folded into ''68 idle/abandoned/COMPLETE agent(s) hidden''. Two surfaces over one dataset giving different totals and different membership, with no way for a reader to tell which is right. Define ONE vocabulary for the counts (discovered / working / running / idle / hidden) and make both surfaces report the identical numbers from the identical predicate, each naming what it omitted.'
  status: pending
- id: events-limit-is-unbounded-and-ignores-negative
  note: 'Measured against the live server: /api/events?limit=99999999 returns 3,586,977 bytes (3.5MB, the entire 10026-row store) and /api/events?limit=-5 returns 3,585,213 bytes -- a NEGATIVE limit is silently ignored rather than rejected or clamped, and dumps everything. This is the largest payload the tool can be made to produce, from a single malformed query, and any panel bug or hand-edited URL triggers it. Clamp limit to a sane maximum and reject/normalize non-positive values, reporting the applied limit and the true total in the response so the caller can see it was capped rather than silently receiving a truncated or gigantic set.'
  status: pending
- id: keep-gui-escaping-verified-under-hostile-values
  note: 'Witnessed PASSING and worth keeping verified rather than assumed: navigating the GUI to #panel=tree&sess=<img src=x onerror=window.__xss=1> produced xss_fired false, injected_img false, and no literal onerror handler anywhere in document.body.innerHTML -- the sess value is escaped on render even though /api/process-tree echoes the raw string back in its JSON. Any presentation rework that changes how event details, instruction text, prompts or project names reach the DOM must re-run this check, because the drained/reshaped render path is exactly where an escape gets dropped. Event detail strings now come from arbitrary gm output (error/reason fields), so they are the highest-risk new sink.'
  status: pending
- id: banner-and-cards-contradict-within-one-render
  note: 'Sharpest witness of the liveness bug, captured in a SINGLE DOM read: the banner line reads ''gm (watcher not running, silent 0m, 0.1 deviations/min)'' while the card section immediately below reads ''RUNNING - 3'' and lists gm as RUNNING -- the same project, same screen, same instant, described as both not-running and running. An earlier capture showed the banner and cards also disagreeing on the running/idle split (6 ''working'' vs 2 running + 4 idle). Two components computing liveness from different inputs is the root shape; the fix is one predicate, computed once, consumed by both, so a contradiction becomes structurally impossible rather than merely corrected this once.'
  status: completed
  witness: 'The contradiction was two components deriving liveness from different inputs: the banner rendered watcherAlive as a claim about the WATCHER while the cards rendered the same underlying per-project activity as RUNNING/IDLE, so a single DOM read caught ''gm (watcher not running, silent 0m)'' in the banner and gm listed under ''RUNNING - 3'' in the cards, same screen, same instant. Both now read from the same per-project activity fact and use the same vocabulary: banner says ''dispatching''/''idle'' per row plus a ''N dispatching - N idle'' total, cards keep RUNNING/IDLE sections. Witnessed post-fix in one browser read (browser-9340): banner ''3 dispatching - 3 idle'' with gmsniff/spoint/gm marked dispatching and looper/casey/aloop idle -- consistent with the card sections rather than contradicting them, and the stale phrasing absent from the rendered text.'
  commit_comment: Resolve the banner-vs-cards liveness contradiction by sharing one vocabulary
- id: needs-attention-list-restates-without-adding
  note: The live-agents panel renders a 'Needs attention:' block listing 'aloop -- idle mid-chain', 'gmsniff -- dispatching now', 'gm -- dispatching now'. Two of the three reasons are 'dispatching now', which is the healthy state and the opposite of needing attention, and every named project already appears in the cards below with its full phase and timing. The block consumes prime vertical space above the fold to restate rows the reader is about to see, with a label that miscategorises normal activity as a problem. Either make it surface only what the cards do NOT already show (a genuine anomaly with its measurement) or remove it -- a heading that promises triage and delivers a duplicate roster costs more attention than it saves.
  status: pending
- id: card-repeats-cwd-phase-and-agent-name-redundantly
  note: 'Each agent card renders, in order: name (gmsniff), RUNNING, ''gm'', ''ORCHESTRATOR'', the full absolute cwd (C:\dev\gmsniff), the phase (PLAN), then ''9m 31s - prd 0/0 - mut 0'' and ''last event 45s ago''. The name and the cwd basename are the same fact twice; ''gm'' is constant across every card and carries nothing; ORCHESTRATOR is the prose heading covered by its own row. That is roughly half the card''s lines spent before reaching the first distinguishing measurement. Restructure so the scanning order matches what an observer actually needs -- which agent, what phase, how long, how stale, what it is doing -- with the constant and duplicated fields removed or demoted to the drilldown.'
  status: pending
