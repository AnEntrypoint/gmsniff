- id: sync4-drift-recurs-fourth
  title: Record the fourth drift recurrence and what it implies operationally
  body: 'sync:ds:check has gone clean-to-drifted FOUR separate times in this session. That is not noise to tolerate: it means a green drift check is only valid at the instant it ran, so every verification pass must re-run it rather than cite an earlier green, and any vendored-file fix must be confirmed to have reached upstream or it will be silently reverted by the next sync.'
  SESSION_ID: gmsniff-sync4-1785259806
  status: completed
  witness: 'Confirmed by count and acted on, not merely noted: sync:ds:check has gone clean-to-drifted FOUR times in this session (colors_and_type/table.js/kits-appended; json-viewer; topbar/primitives/panel-row; now topbar/app-shell/fields). The operational rule this establishes was applied here -- rather than cite the earlier green, this pass re-ran the check, and rather than assume the pager fix would survive, it verified upstream actually carried it (../design/editor-primitives.css:450) before syncing. Both habits are what prevent a silent revert.'
  commit_comment: Record the fourth drift recurrence and the habits it forces
