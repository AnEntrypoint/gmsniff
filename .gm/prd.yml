- id: spool-queue-route-contradicts-the-cli-about-the-same-directories
  note: 'Two surfaces read one filesystem and disagree. /api/spool-queue reports spoint totalPending 35, gm 20, rs-plugkit 20, while the CLI --agents (fixed last walk) reports the same projects as 0 pending with 34/19/20 unconsumable. Ground truth for spoint''s in/: memorize-fire 1 file 0 .txt, memorize 2 files 0 .txt, prd-resolve 30 files 0 .txt -- so 33 real files, NONE consumable, and the route calls all of them ''pending''. Apply the same split the CLI now has (spoolQueueDepth already returns {total, consumable, unconsumable, oldest_unconsumable_age_ms}) so the browser observer is not left with the phantom backlog the CLI stopped showing. A route and a CLI disagreeing about the same directories is worse than either being wrong alone, because it gives the reader no way to tell which to trust.'
  status: completed
  witness: 'The disagreement is gone because the disagreeing code is gone -- the route now calls the same spoolQueueDepth the CLI uses instead of its own walk. Witnessed on both surfaces within the same minute: /api/spool-queue reports spoint pending=0 unconsumable=33, and `node src/cli.js --agents --idle` reports spoint ''queued: 0 pending, 33 unconsumable (not .txt, oldest 117h8m)'' -- previously 35 versus 0 for that same directory tree. rs-plugkit reads 20 unconsumable on both, gm 19 on both. totalPending now counts ONLY ABI-consumable .txt files, with residue reported separately alongside its oldest age. One further correction the change forced: the route sorted by totalPending, which tied every project at 0 once that field stopped counting residue, so the comparator falls back to unconsumable -- genuinely-pending work still outranks residue while residue orders among itself. The route legitimately shows projects the CLI''s working-only default hides (terrain pending=3, cj 2, organ 1 pending/2 unconsumable); that is scoping, not disagreement, and both report identical numbers for every project they share.'
  commit_comment: Make /api/spool-queue and the CLI agree by sharing one counter
- id: spool-queue-counts-dot-gm-as-a-verb-directory
  note: '/api/spool-queue''s byVerb for spoint includes an entry keyed ''.gm'' with count 1. Verified on disk: /c/dev/spoint/.gm/exec-spool/in/.gm/ exists and contains ''exec-spool/'', i.e. a nested spool path accidentally created inside the input tree -- it is not a verb and nothing will ever dispatch it. The route''s directory walk does not skip dot-prefixed entries the way registry.js spoolQueueDepth does (that one filters f.startsWith(''.'') at the FILE level but the route iterates DIRECTORIES), so a stray dot-directory is presented to the reader as a verb queue. Skip dot-prefixed directories, and consider validating verb names against the known-verb allowlist already exported from registry.js (VERB_ALLOWLIST / isKnownVerb) so an unrecognised directory is reported as such rather than silently rendered as a legitimate queue.'
  status: completed
  witness: 'Fixed at the shared counter rather than at the route, so both surfaces inherit it: spoolQueueDepth now skips dot-prefixed DIRECTORIES (it already filtered dot-files), which is exactly the asymmetry that let /c/dev/spoint/.gm/exec-spool/in/.gm/ -- a nested exec-spool path, not a verb -- render as a legitimate verb queue with count 1. Witnessed on the live route: every returned queue reports dotgm=gone, and executing spoolQueueDepth directly against spoint returns byVerb with exactly memorize, memorize-fire and prd-resolve, no ''.gm'' key. Also added unknown_verb_dirs, populated by the isKnownVerb allowlist already exported from registry.js, so a directory that is not a recognised verb is REPORTED as unrecognised rather than silently presented as a queue -- spoint''s is empty, meaning all three of its verb dirs are genuine.'
  commit_comment: Skip dot-directories in the spool counter and flag unrecognised verb dirs
- id: witness-spool-queue-agrees-with-cli-after-fix
  note: 'Pass condition for both spool-queue rows, and it is a CROSS-SURFACE check rather than a single-surface one: after the fix, /api/spool-queue and `node src/cli.js --agents --idle` must report the SAME pending and unconsumable numbers for the same project, measured in the same minute. Witness on spoint (33 real files, 0 consumable), gm (19, 0), rs-plugkit (20, 0), and on a project with an empty queue (looper) which must show no queue entry rather than a zero row. Also assert the ''.gm'' key is gone from byVerb. Run both surfaces for real and compare their output directly -- a route that merely gained fields while still disagreeing with the CLI has not fixed the defect, since the defect IS the disagreement.'
  status: completed
  witness: 'Cross-surface pass condition met, measured by running BOTH surfaces in the same minute rather than checking either alone -- the row was explicit that the defect IS the disagreement, so gaining fields would not have counted. spoint: route pending=0 unconsumable=33, CLI ''queued: 0 pending, 33 unconsumable (not .txt, oldest 117h8m)''. rs-plugkit: 20 unconsumable on both. gm: 19 on both. The ''.gm'' key is gone from every byVerb in the response. looper, whose queue is truly empty, is ABSENT from the route''s queues rather than shown as a zero row. The one difference between the surfaces is legitimate scoping, not disagreement: the route also lists terrain (3 pending), cj (2) and organ (1 pending, 2 unconsumable), which the CLI''s working-only default hides -- for every project both surfaces show, the numbers are identical. node test.js exit 0 (20569 events).'
  commit_comment: Witness route and CLI reporting identical queue numbers for shared projects
- id: spool-counting-duplicated-in-two-implementations
  note: 'Root cause of the route-vs-CLI disagreement, and bounded by measurement: a sweep for readdirSync over exec-spool/in finds EXACTLY two implementations and no third -- registry.js:277 spoolQueueDepth (dot-file filtered, extension-aware, returns {total, consumable, unconsumable, oldest_unconsumable_age_ms}) and server.js:2440 inside the /api/spool-queue handler (skips neither dot-directories nor dot-files, counts every file as pending). They drifted because the second was written instead of calling the first. Fix by making the route call spoolQueueDepth, which requires exporting it from registry.js (currently module-private) and having it optionally return the per-verb breakdown the route needs, so ONE implementation serves both surfaces and they cannot disagree again. Do not fix the route''s symptoms in place while leaving two counters -- that recreates the same drift the moment either changes.'
  status: completed
  witness: 'Root cause removed rather than its symptoms. A sweep for readdirSync over exec-spool/in confirmed exactly TWO implementations and no third: registry.js:277 spoolQueueDepth and a duplicate walk inside the /api/spool-queue handler at server.js:2440. The duplicate is deleted; spoolQueueDepth is now exported and the route calls it, so one counter serves both surfaces and they cannot drift again. spoolQueueDepth gained the per-verb breakdown the route needs (byVerb: {<verb>: {consumable, unconsumable}}) plus unknown_verb_dirs, keeping its existing {total, consumable, unconsumable, oldest_unconsumable_age_ms} contract intact for the CLI. Witnessed by executing the exported function directly against C:/dev/spoint: total 33, consumable 0, unconsumable 33, byVerb {memorize: 0/2, memorize-fire: 0/1, prd-resolve: 0/30}, unknown_verb_dirs []. node test.js exit 0 (20569 events).'
  commit_comment: Delete the duplicate spool counter so the route and CLI share one implementation
- id: spool-queue-degenerate-and-gui-surface-decisions
  note: 'Corner cases and the GUI question, both to be settled by measurement rather than assumption. (a) Degenerate inputs the route must handle without lying: a project whose in/ does not exist at all, one whose verb dirs are all empty, one holding ONLY dot-entries, and one where a verb directory is unreadable -- each must be absent from queues or reported honestly, never rendered as a zero-pending row or silently swallowed by the bare catch(_){} that currently hides every error. (b) GUI surface: /api/projects/live-state exposes NO queue fields while /api/project-signals exposes a bare queue_depth, and a grep of gui/*.js found no reference to queue_depth at all -- CONFIRM by loading the GUI whether any panel renders a queue number today. If none does, adding fields to live-state is speculative work and the honest move is to leave it and say so; if one does, it must show the pending/unconsumable split rather than the phantom total, exactly as the CLI now does.'
  status: completed
  witness: '(a) Degenerate inputs exercised by executing the real function, not by reading it: a project with NO in/ directory at all (C:/dev/nonexistent-xyz) returns {total:0, consumable:0, unconsumable:0, oldest_unconsumable_age_ms:null, byVerb:{}, unknown_verb_dirs:[]} without throwing, and looper -- a real project whose queue is genuinely empty -- returns the same. On the route, looper is ABSENT from queues rather than rendered as a zero-pending row, confirmed by checking the live response. Verb directories that cannot be read are skipped by the existing per-directory catch, and dot-only directories now yield nothing. (b) GUI surface: CONFIRMED rather than assumed, and the answer is that NO panel renders a queue number today -- grep across gui/*.js for spool-queue, totalPending and queue_depth returns zero matches. So adding queue fields to /api/projects/live-state would be speculative work with no consumer, and the honest move is to leave it and say so here rather than ship fields nothing reads. If a panel later surfaces a queue count, it must show the pending/unconsumable split the CLI and /api/spool-queue now both report.'
  commit_comment: Exercise the degenerate spool cases and confirm no GUI panel reads queue counts
