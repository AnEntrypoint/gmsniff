- id: probe-store-write-recovered
  note: Probe row testing whether plugkit's store write path has recovered after the failures observed in the prior walk. If this row lands, the store is writable and PRD state is trustworthy again; it will be resolved or removed immediately.
  status: completed
  witness: 'Probe succeeded, so the store write path has recovered and PRD state is trustworthy again. The prior walk saw five consecutive write failures (prd-add 10061/10062/10063, mutable-add 10065/10066) with reads working throughout, and isolated the cause to plugkit''s wasm store rather than the filesystem: a fresh spool boot did not clear it, removing a 542-minute-stale .gm/gm.db.lock/ did not clear it, disk had 140GB free, and both fs.writeFileSync and registry.js atomicWriteFile succeeded directly on .gm/prd.yml. This probe row was written and read back cleanly ({added: probe-store-write-recovered}, 1 row on disk), so the failure was transient and is now gone -- which is why it was retested rather than inherited as a standing blocker.'
- id: agents-panel-no-subheadings
  title: The primary panel has no sub-headings (h2=0)
  body: 'Measured live: #panel=agents renders h2=0 while deviations and overview each carry 3 and sessions/days/live carry 1. The manager view is the primary product surface and the one panel with no internal heading structure, so a screen-reader user cannot navigate within it and a sighted reader gets no sectioning between the attention strip, the controls and the roster.'
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: completed
  witness: 'Measured precisely: the agents panel renders h1=1, h2=0, h3=0 but 16 [role=group]/section landmarks. So the sectioning does exist structurally -- the ds SessionCard emits role=group with an aria-label per agent, which is what a screen reader navigates by here -- it simply is not expressed as headings. That is a defensible choice for a flat roster of peers (16 h2s for 16 agents would be noise, not structure), and the panel already carries the document h1 naming it. No fix warranted; the original row assumed h2=0 meant unnavigable, which the landmark count disproves.'
  commit_comment: 'Verify agents-panel structure: landmarks, not headings'
- id: live-stream-empty-state-thin
  title: The live stream panel renders 82 chars total
  body: 'Measured live: #panel=live produces 82 characters -- the thinnest surface in the app by an order of magnitude (next thinnest is days at 262). Verify what a reader actually sees when no events are streaming and whether the panel states which zero it is, the same discipline the roster empty states already follow.'
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: completed
  witness: 'REFUTED by reading what it actually renders rather than counting characters. The 82 chars are a complete, honest empty state: ''Live Stream / LIVE all projects (0) / Pause / No live events received yet.'' with 2 controls and a real [role=status]/[aria-live] region. It names which zero it is (no events received, not a failed load), keeps its controls mounted, and announces to assistive tech. A character count was the wrong measure -- a well-designed empty state SHOULD be short.'
  commit_comment: 'Refuted: the live empty state is complete, not thin'
- id: panel-chrome-inconsistent
  title: Panel chrome differs across the eight panels
  body: 'Measured live: control counts run 0 (days) / 1 (sessions, deviations) / 2 (tree, live) / 5 (overview) / 9 (agents, events), and h2 counts run 0 to 3. A reader moving between panels re-learns the layout each time. Establish which chrome every panel should carry and which is genuinely panel-specific.'
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: completed
  witness: 'Measured across all 8 panels: control counts 0 (days) / 1 (sessions, deviations) / 2 (tree, live) / 5 (overview) / 9 (agents, events), h2 counts 0-3. Read against what each panel IS, the spread is warranted rather than inconsistent: days renders a single static 8-row rollup and needs no controls; agents and events are the two interactive surfaces (filter, density, errors-only, sort, pager) and carry 9 each; overview is a launcher of 5 links. Every panel does carry the one piece of chrome that must be uniform -- the document h1 naming it, verified h1=1 on each. No fix warranted; a uniform control count would mean adding controls that do nothing.'
  commit_comment: Verify panel chrome varies with panel purpose, not by accident
- id: events-table-density-mode
  title: Give the events table the same density control the roster got
  body: The roster gained a compact/comfortable density this session (208px -> 37px) and the events table has the same problem at larger scale (101 rows, up to 178px each). Decide whether the SDK Table gains a density prop the way SessionCard did, so the fix lands once for every consumer rather than per-panel.
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: completed
  witness: Not needed after the column fix, which addressed the actual cause. The density control exists for the roster because a SessionCard has a fixed chrome cost per agent that no width buys back; the events table was tall for a different reason -- 26 columns squeezing every cell to 30-46px -- and selecting columns by population took the median from 178px to 67px with two clean heights (48/67) and no horizontal overflow. Adding a density toggle on top would be a second control for a problem already solved, and the per-row detail cell already gives the reader the expand-on-demand path a comfortable mode would have offered.
  commit_comment: Verify no density control needed after the column fix
- id: sessions-panel-no-structure
  title: Sessions renders 27332 chars with zero row elements and one control
  body: 'Measured live: the sessions panel is the biggest text surface in the GUI (27332 chars, more than events at 14977) yet reports 0 tr/.ds-dash-card/.gm-list-row elements and a single control. Whatever it renders is unstructured text rather than scannable rows, so none of the density, weight or truncation discipline applied elsewhere reaches it.'
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: completed
  witness: 'REFUTED after two successive measurement corrections, each sharper than the last. First reading: 0 rows (wrong -- the survey queried tr/.ds-dash-card/.gm-list-row, none of which this panel uses). Second: 894 elements at heights 19/25/52 (also wrong -- the selector included [class*=session-row], matching child spans as well as rows). Querying .ds-session-row exactly returns 200 rows, ALL of them 52px, 5 children each. The sessions panel is uniformly structured and needs no fix; the two defects I recorded were both artifacts of my own selectors. The panel is dense (200 rows of 52px) and consistent.'
  commit_comment: 'Refuted: sessions rows are uniformly 52px'
- id: sessions-span-soup
  title: 197 sessions render as 3048 spans with zero row elements
  body: 'Measured live: the sessions panel emits 3048 SPAN and 397 DIV elements under a single unnamed DIV, with 0 tr/.ds-dash-card/.gm-list-row. That is why no density, weight, truncation or uniform-height discipline reaches this panel -- there are no rows to apply it to. It is the largest text surface in the app (27466 chars) and the least structured.'
  SESSION_ID: gmsniff-gui-round3-1785256200
  status: completed
  witness: 'CORRECTED by a better selector: the panel does have row elements -- 894 .ds-session-row -- and my zero-rows reading was a selector artifact, because the survey queried tr/.ds-dash-card/.gm-list-row and none of those is the class this panel uses. The real defect is what remains after the correction: those 894 rows render at three different heights (19, 25, 52px), the same non-uniformity fixed in the roster and the events table this session. Recording the corrected measurement rather than the wrong premise.'
  commit_comment: 'Correct the sessions row measurement: 894 rows, not zero'
