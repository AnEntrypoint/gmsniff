  witness: measured per-file comment ratios across gui/
  status: pending
- id: forcegraph-comment-pass
  text: 'gui/forcegraph.js still carries 11 comment lines that the rule says should be code: three step comments (Coulomb repulsion all pairs / Hooke spring along edges / Gentle center pull + damping + integrate) each label a loop that should be a named function, and six constants carry trailing comments that belong in their identifiers (SPRING_LEN -> SPRING_REST_LENGTH, MIN_DIST -> MIN_DIST_GUARDING_DIVISION_BY_ZERO, the bare 10 -> EDGE_MARGIN). The header physics description is recoverable once the functions are named; the callers MUST call stop() contract is not and must survive. A first attempt at this was reverted by the concurrent owner of gui/, so it belongs to whoever owns that file.'
  witness: measured 11 comment lines; three of them label loops, six annotate constants
  status: pending
- id: single-writer-collision-on-gui-forcegraph
  text: 'Real single-writer collision observed: edits to gui/forcegraph.js were overwritten wholesale by the concurrent agent that owns gui/, reverting a completed comment pass (named functions, renamed constants, trimmed header). Confirms the discipline -- per-file ownership must be respected even for a small isolated file, and a second writer should hand the change to the owner rather than applying it directly.'
  witness: gui/forcegraph.js mtime 18:48 with zero occurrences of the extracted function name written minutes earlier
  status: pending
- id: test-asserts-exact-counts-catches-double-ingest
  text: 'The runtime-failure test asserting countHere(wasm_panic) === 1 is correct and should NOT be relaxed to a >= or a dedupe: it is what surfaced double-ingest-replay-plus-tailer. Keep exact-count assertions scoped to a fixture cwd; they are the only thing that catches a duplication that otherwise just looks like larger, more credible numbers.'
  witness: the assertion failed 2 !== 1 against a fixture that writes exactly one panic line
  status: pending
- id: concurrent-agent-write-clobber
  text: A scripted whole-file rewrite from a stale in-memory copy silently reverted another writers completed edits, twice, with no error. Read-back verification after every scripted edit is mandatory -- grep for the identifiers the edit was supposed to introduce, and treat their absence as a clobber rather than assuming the write landed.
  witness: 'observed twice this session: gui/forcegraph.js reverted, and the GUI agent caught its own rename pass reverted the same way'
  status: pending
- id: orphan-css-classes
  text: gui-extra.css declares gm-bar-visual, gm-center-mt-14, gm-conflict, gm-flex-2, gm-graph-node and gm-muted-12 with no consumer anywhere. Note gm-health-amber and gm-health-red are NOT orphans despite appearing so -- they are built by string concatenation, which a naive grep misses.
  witness: GUI agent verified consumers for each; the two false positives are concatenated at their use site
  status: pending
- id: gui-consume-runtime-failures
  text: 'The GUI shows snapshot.errors, which is STRUCTURALLY always 0 because gm runtime failures carry neither ok:false nor err. Verified live: errors 0 while runtimeFailures reports wasm_panic 1 in the same payload. A panel displaying errors is displaying a number that can never be non-zero. Consume runtimeFailures and runtimeFailuresTotal instead, per-name and unranked.'
  witness: 'live /api/snapshot: errors 0, runtimeFailuresTotal 1, runtimeFailures {wasm_panic:1}'
  status: pending
- id: gui-consume-parse-health
  text: '/api/parse-health is unconsumed by any panel. It reports per-project parse coverage for all 70 projects unfiltered, plus correlation honesty (dominant_kind run at 71.8 percent, best_kind sess, has_true_session true) and the full line-class breakdown (378065 lines: 55992 event, 121083 dispatch, 19649 spawn, 19752 blank). Surfacing it makes an unparsed upstream format change visible instead of silent.'
  witness: live /api/parse-health with 70 project rows and a populated correlation block
  status: pending
- id: document-panic-emitted-twice-by-design
  text: 'gm emits a panic through BOTH channels from one handler (rs-plugkit wasm_dispatch/events.rs:38-55): a host_log WASM PANIC at text line AND an emit_event wasm_panic record. Measured 13 text lines against 14 evt records with 13/13 twinned and zero orphans. Modeling the text line as its own event would double-count every panic. Record this so a future parser pass does not add it.'
  witness: server agent measured the twinning against real data and read the gm emitter source
  status: pending
- id: gm-spool-dirs-adds-not-restricts
  text: GM_SPOOL_DIRS ADDS a discovery root rather than restricting discovery -- C:/dev and process.cwd() are always scanned (src/index.js:309). Existing tests pass only because each asserts against its own projects rows; a future test asserting a fleet-wide total would be machine-dependent and fail on another machine. Document the semantics, and keep fixture assertions scoped to their own cwd.
  witness: server agent traced it to src/index.js:309 while diagnosing a fixture count
  status: pending
- id: preserve-gm-own-vocabulary-in-sweep
  text: The sweep must NOT strip gm own documented vocabulary. cli.js DEVIATION_META severities map each deviation kind to the recovery verb gm itself names (stuck-loop-escalation -> wfgy-method, push-dirty -> git_status then git_commit); that is reporting gm facts, not gmsniff inventing a judgement. Same for the severity field gm writes into its own prd.yml rows. Distinguish reporting-anothers-classification from minting-our-own.
  witness: cli.js:687-699 severities carry gm documented recovery verbs per kind
  status: pending
- id: sweep-all-hardcoded-error-checking
  text: 'Run a whole-tree sweep for the same pattern the user named: any code deciding something is an error and then acting on that decision -- invented severity scores, thresholds that omit data from a result set, ok/degraded/critical labels standing in for the numbers behind them, and boolean is-broken predicates. Replace each with the measurement and its age. A threshold that affects only presentation may stay ONLY if the count hidden is stated, the criterion named, and the underlying numbers remain reachable.'
  witness: 'user directive: no hard coded error checking anywhere, just report information as informatively as possible'
  status: pending
- id: gui-has-no-test-coverage-asymmetry
  text: 'test.js pins /api/project-signals against ever attaching a severity, but NO test covers the GUI side -- and that asymmetry is exactly how a ten-term attention score and a row-dropping filter survived client-side while the server was locked down. The server is guarded by assertions; the client is guarded only by whoever happens to look. Closing it needs a DOM, which the zero-dependency no-test-framework constraint makes non-trivial, so the design question is real: either assert against the served module exports without a DOM, or accept that the browser witness is the only client guard and make that explicit rather than implicit.'
  witness: server agent added the project-signals no-severity assertion; the same class of defect then appeared unguarded in gui/app.js and gui/live-agents.js
  status: pending
- id: null-sorts-as-zero-class-audit
  text: 'The health banner sorted staleSeconds == null (no events ever) as zero seconds silent, putting the MOST suspicious project last. That is a class, not a one-off: any comparator or aggregate over a nullable measurement can silently invert its own meaning. Audit every sort and every min/max/avg over a field that can be null, and decide explicitly whether absent means zero, means Infinity, or must be excluded and reported separately.'
  witness: fixed in longestSilentFirst by mapping null to Infinity; found only because the verdict removal forced a rewrite of the comparator
  status: pending
- id: rotation-detected-only-by-shrink
  text: 'ProjectLogTailer detects rotation by stat.size < offset, so it recovers only when the replacement file is STRICTLY SMALLER. Real probe: rewriting a 110-byte log with 77 bytes correctly picked up the new event, but rewriting a log with same-or-greater size left stat.size >= offset, the reset never fired, and the new content was silently missed -- the tailer kept reading from a stale offset into unrelated bytes. Size is the wrong rotation signal: use the file identity (inode/ino on posix, or a birthtime/ino pair) or compare a leading-bytes fingerprint, so a rotation that happens to produce an equal-or-larger file is still detected.'
  witness: 'real probe: 110->77 bytes recovered (saw after-rotate); equal-size rewrite saw only the pre-rotation event'
  status: pending
