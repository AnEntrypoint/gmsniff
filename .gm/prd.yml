- id: watcher-stopped-serving-gmsniff-blocking-commit
  note: 'STUCK STATE, recorded rather than blind-retried. The shared agentplug daemon accepts `bun x gm-plugkit@latest spool` and prints ''registered C:\dev\gmsniff'' but never refreshes this project''s .gm/exec-spool/.status.json -- heartbeat measured 11042s then 11096s then 11232s stale across three boots, i.e. frozen for over 3 hours while wall-clock advanced. in/git_finalize/9860.txt has been queued that whole time and no out/ file appears. This is NOT the reboot-loop convergence case: .watcher.log shows no codeinsight_rebuild/deferred_files lines, its last entries are a 44796ms transition dispatch and repeated ''exec rc=5 msg=database is locked'' rssearch failures from concurrent agents (spoint and gm are both live on the same store). An earlier identical wedge DID clear on its own after ~48s, so the daemon recovers unpredictably. Tried: three boots, bounded condition-waits on both the queue file and the heartbeat. The work itself is DONE and witnessed -- 5 PRD rows completed, node test.js exit 0 at 11594 events -- only the commit is blocked. Recovery is to re-dispatch git_finalize once the heartbeat advances, or fall back to the git verbs individually; do not re-dispatch while the file is still queued or the same commit lands twice.'
  status: completed
  witness: 'Cleared, and the commit it was blocking is now pushed. The daemon''s heartbeat was frozen for over 3 hours (11042s -> 11096s -> 11232s stale across three boots while wall-clock advanced) with in/git_finalize/9860.txt queued the whole time. Diagnosed as NOT the reboot-loop case -- .watcher.log had no codeinsight_rebuild/deferred_files lines, only a 44796ms transition dispatch and repeated ''exec rc=5 msg=database is locked'' from spoint and gm hammering the shared store -- so re-booting was the wrong move and a bounded condition-wait was the right one. It recovered on its own after ~20s of the final wait and drained both queues, exactly as an earlier identical wedge had cleared after ~48s. Deliberately did NOT re-dispatch while the file sat queued, which would have committed twice. Two gate denials followed and each named its own recovery: the first git_finalize was refused with long-gap-no-instruction at 11430402ms (the wedge itself), the second at 325839ms because my own wait loops had consumed the 300s window between the recovery instruction and the commit -- fixed by pairing them tightly rather than by improvising around the denial. Commit 0b0472b landed, follow-on cab0f24 cleared the rows, HEAD 8df2b267, worktree clean, 0 unpushed.'
  commit_comment: Record and clear the 3-hour watcher wedge that blocked this commit
