- id: mut-browser-witness-client-edits
  text: Can the browser verb witness client-side edits via DOM inspection against the live GUI? RESOLVED YES -- the earlier 'environmental gap' finding on this row was a wrong diagnosis, not a real blocker.
  status: witnessed
  witness_evidence: 'CORRECTED AND SUPERSEDES this row''s earlier evidence. The earlier entry concluded the browser verb had a ''real, reproducible environmental gap'' after 8+ failed dispatches, cited ''typeof page returned undefined'' and SyntaxError on session close/reset as proof, and adopted curl + node --check as substitute witnesses for every client-side change. That diagnosis is REFUTED by execution: the verb works. It evaluates its body in the PAGE context (cdp-eval), so an unbound `page` and failing session subcommands are the expected symptoms of writing driver-context code, NOT evidence of a broken environment. Witnessed both halves against the live GUI at http://127.0.0.1:7799/: a body using page.evaluate returned exit_code 1 with stderr ''cdp-eval: exception ReferenceError: page is not defined'', while the identical URL with browser-context code (`return {title: document.title, bodyLen: document.body.innerHTML.length}`) returned exit_code 0 with real DOM values {title:''gmsniff'', bodyLen:37507, hasShell:true}, and a follow-up dispatch read the full live-agents panel (35 nav controls, ''5 working agents, longest-silent first'', per-row phase/elapsed/pending counts). Correct body shape: `url=<target>` and optional `timeout=<ms>` prefix lines are parsed by the watcher; everything after runs inside the page with bare document/window and a plain return. Use `await new Promise(r => setTimeout(r, ms))` instead of page.waitForTimeout. Browser dispatches take 2-6s, so a first-read miss on the out file is normal latency, never proof of a dead watcher. Superseding memory fired as mem-25273e0f4a5ea9d1-1466; AGENTS.md carries it as the fourth verification trap.'
