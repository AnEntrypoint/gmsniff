- id: mut-upstream-ds-vendorability
  claim: anentrypoint-design ships sessions.js (SessionDashboard/fmtAgo), agent-chat.js, markdown.js, gm-prose.css unvendored -- exactly the in-process-manager surface. Need to confirm they import cleanly under gmsniff bare webjsx importmap with no extra deps.
  status: witnessed
  witness_method: read each upstream file import graph, then browser dispatch loading them in the real GUI
  witness_evidence: 'Real read of every candidate import graph in C:/dev/anentrypoint-design. Transitive closure by candidate: (1) sessions.js 33099B imports vendor/webjsx, shell.js{Btn,Icon}, content.js{Select,SearchInput}, data-density.js{PhaseWalk} -- all ALREADY vendored -- plus src/locale.js{formatDateTime,formatNumber} which imports src/i18n.js. Cost = 2 small leaf files (locale 3154B + i18n 2560B). CHEAPEST and highest value. (2) markdown chain: markdown.js 7282B needs html-escape.js 1669B; markdown-cache.js 6230B needs markdown.js + highlight.js + debug.js 1014B. Cost = 4 small files. BUT highlight.js:9 sets DEFAULT_PRISM_BASE=https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/ -- a runtime CDN fetch, unacceptable for a local offline observability GUI; markdown.js exposes isDegraded so markdown must be vendored WITHOUT highlight, or highlight repointed at a local/no-op base. (3) context-pane.js 7231B needs content.js{Panel,Row}, shell.js{Btn}, sessions.js{fmtDuration} -- cheap once sessions lands. (4) interaction-primitives.js 18555B and form-primitives.js 9397B import only vendored webjsx + shell.js{Icon}: ZERO new leaves, trivially vendorable. (5) files.js 33837B imports only webjsx + shell.js: zero new leaves. (6) virtual-scroll.js 5441B needs only debug.js. (7) agent-chat.js 33565B is the EXPENSIVE tail: pulls chat.js 35322B which pulls i18n, debug, files.js, overlay-primitives{EmojiPicker}, markdown-cache, and chat-message-parts.js 23135B -- roughly 92KB plus the whole markdown chain for a chat transcript UI whose message model does not match gm event records. Verdict: vendor sessions/context-pane/interaction-primitives/form-primitives/files/virtual-scroll/markdown chain; do NOT vendor agent-chat/chat unless the streaming-output panel provably needs them, and resolve the Prism CDN issue before shipping highlight.'
